<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLPT N1 합격노트</title>
<style>
/* 쉬운 디자인: 밝은 바탕, 흰 카드, 파란 포인트 하나, 큰 글씨와 큰 버튼 */
:root{--bg:#f3f5f9;--ink:#1c2230;--mute:#6b7280;--line:#e3e7ee;--card:#ffffff;--shu:#e5484d;--ai:#3563e9;--ok:#16a34a;--okbg:#e8f7ee;--badbg:#fdecec;--soft:#eaf0fe}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.jp{font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif}
.mc{font-weight:800}
header{padding:14px 18px 6px;display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-size:21px;font-weight:800}
header span{display:none}
main{max-width:720px;margin:0 auto;padding:6px 16px 20px}
h2{font-size:26px;font-weight:800;margin:6px 0 4px}
h3{font-size:18px;margin:24px 0 10px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;color:var(--mute);text-decoration:none;font-size:12.5px;font-weight:700}
nav.tabs a b{font-size:20px;line-height:1;font-weight:400}
nav.tabs a.on{color:var(--ai)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.seg button{flex:none}
.seg button,.btn{font:inherit;font-size:16px;font-weight:700;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg button.on{background:var(--ai);color:#fff}
.btn.pri{background:var(--ai);color:#fff}
.btn.ai{background:var(--soft);color:var(--ai)}
.btn:disabled{opacity:.4}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
input,select{font:inherit;font-size:16px;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{background:var(--ai);color:#fff;border-radius:22px;padding:20px 20px 18px;margin:6px 0 16px}
.hero .hint,.hero .sub{color:rgba(255,255,255,.85)}
.hero input{background:rgba(255,255,255,.18);border:0;color:#fff;min-height:38px;color-scheme:dark}
.dday{font-size:64px;font-weight:800;line-height:1.05;margin:6px 0 2px}
.dday small{font-size:20px;font-weight:700;margin-left:6px;opacity:.85}
.stamp{display:none}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 6px}
.menu a{background:#fff;border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.menu a b{font-size:18px}.menu a span{color:var(--mute);font-size:14px}
.menu a .bar{margin-top:8px}
.bar{height:8px;border-radius:4px;background:#e9edf3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);border-radius:4px}
.prog{display:grid;grid-template-columns:6em minmax(0,1fr) 5em;gap:10px;align-items:center;padding:6px 0}
.prog span:last-child{text-align:right;color:var(--mute);font-size:14px;white-space:nowrap}
.plan{list-style:none;padding:6px 16px;margin:0;background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plan li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.plan li:last-child{border:0}
.plan li b{font-size:22px;color:var(--ai);text-align:center}
details.box{background:#fff;border-radius:18px;padding:4px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
details.box>summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none}
details.box>summary::after{content:"＋";float:right;color:var(--mute)}
details.box[open]>summary::after{content:"－"}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-size:13px}
.q{background:#fff;border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.q .lab{font-size:13px;color:var(--mute);margin-bottom:6px}
.q .lab b{color:var(--ai)}
.q .body{font-size:18px;line-height:1.75;margin-bottom:12px}
.q .body u{text-decoration-color:var(--ai);text-decoration-thickness:3px;text-underline-offset:5px}
.q .word{font-size:28px;font-weight:800;margin:2px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-family:"Noto Sans JP","Noto Sans KR",sans-serif;font-size:17px;line-height:1.5;min-height:54px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;width:100%}
.bub{flex:none;width:28px;height:28px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font:700 14px/1 system-ui;color:var(--mute)}
.opt.sel{border-color:var(--ai)}.opt.sel .bub{background:var(--ai);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .bub{background:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--shu)}.opt.bad .bub{background:var(--shu);color:#fff}
.exp{margin-top:12px;padding:12px 14px;background:#f6f8fc;border-radius:12px;font-size:15.5px}
.exp .tr{color:var(--mute);margin:6px 0 0}
.mark{font-weight:800;color:var(--shu);margin-right:6px}.mark.o{color:var(--ok)}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.flash{min-height:min(62vh,460px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;touch-action:pan-y;transition:transform .15s}
.flash:active{transform:scale(.985)}
.flash .w{font-size:clamp(48px,14vw,76px);font-weight:800;line-height:1.15}
.flash .r{font-size:24px;color:var(--ai);margin-top:6px;font-weight:700}
.flash .m{font-size:22px;font-weight:800;margin-top:8px}
.flash .ex{margin-top:16px;font-size:16px;background:#f6f8fc;border-radius:14px;padding:12px 14px;width:100%}.flash .ex p{margin:2px 0}
.tapnext{margin-top:14px;color:var(--mute);font-size:13px}
.hint{color:var(--mute);font-size:14px}
.list{list-style:none;padding:0 16px;margin:0;background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.list li{border-bottom:1px solid var(--line)}.list li:last-child{border:0}
.list button.item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:14px 0;cursor:pointer;min-height:60px}
.list .t{font-weight:700}.list .k{font-size:13px;color:var(--mute)}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:#eef1f6;color:var(--mute);white-space:nowrap}
.chip.done{background:var(--okbg);color:var(--ok)}
#grows{background:#fff;border-radius:18px;padding:0 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
details.g{border-bottom:1px solid var(--line)}details.g:last-child{border:0}
details.g summary{cursor:pointer;padding:13px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;list-style:none}
details.g summary::-webkit-details-marker{display:none}
details.g summary .p{font-size:19px;font-weight:800}
details.g .in{padding:0 0 14px}
.passage{font-family:"Noto Sans JP",sans-serif;font-size:17.5px;line-height:1.95;padding:18px;border-radius:18px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.passage p{margin:0 0 .8em;text-indent:1em}
.trans{font-size:15.5px;line-height:1.8;color:#4b5563;white-space:pre-line;padding:14px 16px;background:#fff;border-radius:14px;margin:12px 0}
.script{margin:12px 0;padding:12px 14px;background:#f6f8fc;border-radius:14px}
.script summary{font-weight:700;cursor:pointer}
.script p{margin:6px 0;font-family:"Noto Sans JP",sans-serif}
.script b{display:inline-block;min-width:2em;color:var(--ai)}
.script .trans{background:#fff}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:12px}
.player .btn.ai{background:var(--ai);color:#fff}
.player .wave{flex:1 1 100px;height:26px;display:flex;align-items:center;gap:3px}
.player .wave i{flex:1;background:var(--ai);border-radius:2px;height:20%;opacity:.3}
.player.playing .wave i{animation:w 1s ease-in-out infinite;opacity:.9}
.player.playing .wave i:nth-child(odd){animation-delay:.2s}
@keyframes w{50%{height:100%}}
@media(prefers-reduced-motion:reduce){.player.playing .wave i{animation:none;height:60%}}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--shu)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.score div{padding:14px;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.score b{display:block;font-size:32px;line-height:1.1;margin-top:4px;color:var(--ai)}
.score .fail b{color:var(--shu)}
.big{font-size:64px;font-weight:800;line-height:1}
.passbadge{display:inline-block;padding:8px 16px;border-radius:99px;font-weight:800;font-size:18px;background:var(--okbg);color:var(--ok)}
.passbadge.no{background:var(--badbg);color:var(--shu)}
.warn{padding:12px 14px;border-radius:14px;background:#fff6e5;color:#8a5a00;font-size:14px;margin:10px 0}
.empty{padding:30px 0;color:var(--mute);text-align:center}
@media(max-width:600px){.prog{grid-template-columns:5em minmax(0,1fr) 4.6em}.q .body{font-size:17px}.score b{font-size:26px}table{font-size:13.5px}.stack thead{display:none}.stack tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.stack td{display:block;border:0;padding:2px 0}}
</style>
</head>
<body>
<header><h1>N1 합격노트</h1></header>
<main id="view"></main>
<nav class="tabs" id="tabs">
<a href="#home" data-v="home"><b>⌂</b>홈</a>
<a href="#vocab" data-v="vocab"><b>あ</b>단어</a>
<a href="#grammar" data-v="grammar"><b>文</b>문법</a>
<a href="#reading" data-v="reading"><b>読</b>독해</a>
<a href="#listening" data-v="listening"><b>♪</b>듣기</a>
<a href="#mock" data-v="mock"><b>✎</b>모의고사</a>
</nav>
<script src="js/vocab.js"></script>
<script>
const VOCAB_RAW=`斡旋|あっせん|알선, 주선|友人の斡旋で今の会社に就職した。|친구의 주선으로 지금 회사에 취직했다.
曖昧|あいまい|애매함|彼は曖昧な返事しかしなかった。|그는 애매한 대답밖에 하지 않았다.
安堵|あんど|안도|無事の知らせを聞いて安堵した。|무사하다는 소식을 듣고 안도했다.
意図|いと|의도|発言の意図がわからない。|발언의 의도를 모르겠다.
委ねる|ゆだねる|맡기다|最終判断は彼に委ねることにした。|최종 판단은 그에게 맡기기로 했다.
潔い|いさぎよい|깨끗하다, 미련 없다|彼は潔く負けを認めた。|그는 깨끗이 패배를 인정했다.
著しい|いちじるしい|현저하다|技術の進歩が著しい。|기술의 진보가 현저하다.
一環|いっかん|일환|研修の一環として工場を見学した。|연수의 일환으로 공장을 견학했다.
否めない|いなめない|부정할 수 없다|準備不足だったことは否めない。|준비 부족이었던 것은 부정할 수 없다.
円滑|えんかつ|원활|交渉が円滑に進んだ。|교섭이 원활하게 진행되었다.
臆病|おくびょう|겁이 많음|臆病な性格を直したい。|겁 많은 성격을 고치고 싶다.
赴く|おもむく|(어떤 곳으로) 향하다|現地に赴いて調査を行う。|현지로 가서 조사를 실시한다.
懐く|なつく|따르다, 친숙해지다|その犬はすぐに子供に懐いた。|그 개는 금방 아이를 따랐다.
概ね|おおむね|대체로|計画は概ね順調だ。|계획은 대체로 순조롭다.
怠る|おこたる|게을리하다|確認を怠ったせいでミスが起きた。|확인을 게을리한 탓에 실수가 일어났다.
傍ら|かたわら|옆; ~하는 한편|仕事の傍ら、小説を書いている。|일하는 한편 소설을 쓰고 있다.
頑な|かたくな|완고함|彼は頑なに意見を変えなかった。|그는 완고하게 의견을 바꾸지 않았다.
画期的|かっきてき|획기적|画期的な発明が生まれた。|획기적인 발명이 탄생했다.
寛容|かんよう|관용, 관대함|他人の失敗に寛容な人だ。|남의 실수에 관대한 사람이다.
規制|きせい|규제|輸入の規制が緩和された。|수입 규제가 완화되었다.
兆し|きざし|조짐|景気回復の兆しが見えてきた。|경기 회복의 조짐이 보이기 시작했다.
拒む|こばむ|거부하다|彼は取材を拒んだ。|그는 취재를 거부했다.
工面|くめん|(돈을) 마련함|学費を工面するのに苦労した。|학비를 마련하는 데 고생했다.
覆す|くつがえす|뒤집다|判決が覆された。|판결이 뒤집혔다.
怪訝|けげん|의아함|彼は怪訝な顔をした。|그는 의아한 표정을 지었다.
懸念|けねん|우려|副作用が懸念される。|부작용이 우려된다.
健在|けんざい|건재|祖父は90歳でも健在だ。|할아버지는 90세에도 건재하시다.
貢献|こうけん|공헌|地域社会に貢献したい。|지역 사회에 공헌하고 싶다.
心得る|こころえる|잘 알고 있다|彼は客の扱い方を心得ている。|그는 손님 다루는 법을 잘 알고 있다.
拘る|こだわる|고집하다, 집착하다|素材に拘った料理を出す店だ。|재료를 고집한 요리를 내는 가게다.
細やか|こまやか|세심함|細やかな心遣いに感謝する。|세심한 배려에 감사한다.
遮る|さえぎる|가로막다|彼は私の話を遮った。|그는 내 말을 가로막았다.
些細|ささい|사소함|些細なことで喧嘩になった。|사소한 일로 싸움이 났다.
指図|さしず|지시, 지휘|人の指図は受けない。|남의 지시는 받지 않는다.
察する|さっする|헤아리다|お気持ちはお察しします。|심정은 헤아립니다.
仕組み|しくみ|구조, 체계|経済の仕組みを学ぶ。|경제의 구조를 배운다.
慕う|したう|사모하다, 따르다|多くの後輩に慕われている。|많은 후배들이 따른다.
渋る|しぶる|꺼리다|彼は返事を渋った。|그는 대답을 꺼렸다.
熟練|じゅくれん|숙련|熟練した職人の技に感心した。|숙련된 장인의 기술에 감탄했다.
執着|しゅうちゃく|집착|過去に執着しても仕方ない。|과거에 집착해도 소용없다.
承諾|しょうだく|승낙|親の承諾を得た。|부모의 승낙을 얻었다.
衝動|しょうどう|충동|衝動買いをしてしまった。|충동구매를 해 버렸다.
迅速|じんそく|신속|迅速な対応が求められる。|신속한 대응이 요구된다.
据える|すえる|앉히다, 설치하다|彼をリーダーに据えた。|그를 리더로 앉혔다.
健やか|すこやか|건강함, 튼튼함|子供の健やかな成長を願う。|아이의 건강한 성장을 바란다.
廃れる|すたれる|쇠퇴하다|伝統工芸が廃れつつある。|전통 공예가 쇠퇴해 가고 있다.
速やか|すみやか|신속함|速やかに退出してください。|신속히 퇴장해 주십시오.
精巧|せいこう|정교|精巧な模型を作る。|정교한 모형을 만든다.
是正|ぜせい|시정|格差の是正が急務だ。|격차 시정이 급선무다.
措置|そち|조치|必要な措置を講じる。|필요한 조치를 강구한다.
損なう|そこなう|해치다, 손상하다|健康を損なう恐れがある。|건강을 해칠 우려가 있다.
携わる|たずさわる|종사하다, 관여하다|教育に携わる仕事をしている。|교육에 종사하는 일을 하고 있다.
漂う|ただよう|감돌다, 떠다니다|部屋に緊張感が漂っていた。|방에 긴장감이 감돌고 있었다.
巧み|たくみ|교묘함, 능숙함|巧みな話術で客を引きつける。|능숙한 화술로 손님을 끌어들인다.
妥協|だきょう|타협|品質に妥協はしない。|품질에 타협은 하지 않는다.
戸惑う|とまどう|당황하다|急な質問に戸惑った。|갑작스러운 질문에 당황했다.
賜る|たまわる|받다(겸양)|貴重なご意見を賜りました。|귀중한 의견을 받았습니다.
費やす|ついやす|소비하다, 들이다|研究に十年を費やした。|연구에 10년을 들였다.

{s:1,t:'bunmyaku',q:'新製品の開発には、各部署の（　）協力が欠かせない。',o:['緊密な','綿密な','精密な','濃密な'],e:'緊密な協力 = 긴밀한 협력. 綿密=치밀한(계획·조사), 精密=정밀한(기계), 濃密=농밀한(내용·시간).',tr:'신제품 개발에는 각 부서의 긴밀한 협력이 빠질 수 없다.'},
{s:1,t:'bunmyaku',q:'長引く不況で、多くの企業が経営の（　）を迫られている。',o:['見直し','見通し','見落とし','見積もり'],e:'見直し 재검토. 見通し=전망, 見落とし=간과, 見積もり=견적.',tr:'장기화되는 불황으로 많은 기업이 경영 재검토를 강요받고 있다.'},
{s:1,t:'bunmyaku',q:'彼はプライドが高く、自分の非を（　）認めようとしない。',o:['頑として','漠然と','着々と','淡々と'],e:'頑として(がんとして) 완강히. 부정 표현과 함께 쓴다. 漠然と=막연히, 着々と=착착, 淡々と=담담히.',tr:'그는 자존심이 강해서 자신의 잘못을 완강히 인정하려 하지 않는다.'},
{s:1,t:'bunmyaku',q:'会議の議論は（　）、結論が出ないまま終わった。',o:['平行線をたどり','一線を画し','白紙に戻り','横並びになり'],e:'平行線をたどる = (의견이) 평행선을 달리다. 一線を画す=선을 긋다(구별하다).',tr:'회의 논의는 평행선을 달리다가 결론이 나지 않은 채 끝났다.'},
{s:1,t:'bunmyaku',q:'彼女のユーモアあふれる一言が、会場の空気を一気に（　）。',o:['和ませた','和らいだ','緩んだ','解けた'],e:'「空気を～」이므로 타동사가 필요. 和ませる(타동사)=누그러뜨리다. 和らぐ・緩む・解ける는 자동사.',tr:'그녀의 유머 넘치는 한마디가 회장의 분위기를 단숨에 누그러뜨렸다.'},
{s:1,t:'bunmyaku',q:'新しいシステムの導入で、作業効率が（　）向上した。',o:['飛躍的に','画一的に','断続的に','保守的に'],e:'飛躍的に向上 = 비약적으로 향상. 画一的=획일적, 断続的=단속적(끊겼다 이어졌다).',tr:'새 시스템 도입으로 작업 효율이 비약적으로 향상되었다.'},
{s:1,t:'bunmyaku',q:'説明が（　）で、結局何が言いたいのかよくわからない。',o:['冗長','頑丈','貴重','慎重'],e:'冗長(じょうちょう) 장황함. 頑丈=튼튼함, 慎重=신중함.',tr:'설명이 장황해서 결국 무엇을 말하고 싶은지 잘 모르겠다.'},

{s:1,t:'iikae',q:'彼の話はいつも<u>大げさ</u>だ。',o:['誇張している','退屈だ','単純だ','曖昧だ'],e:'大げさ = 과장됨 → 誇張している.',tr:'그의 이야기는 항상 과장되어 있다.'},
{s:1,t:'iikae',q:'計画は<u>おおむね</u>予定通りに進んでいる。',o:['だいたい','すべて','ようやく','かろうじて'],e:'おおむね(概ね) = 대체로 → だいたい.',tr:'계획은 대체로 예정대로 진행되고 있다.'},
{s:1,t:'iikae',q:'突然の知らせに、彼女は<u>うろたえて</u>いた。',o:['慌てて','怒って','悲しんで','ためらって'],e:'うろたえる = 허둥대다 → 慌てる.',tr:'갑작스러운 소식에 그녀는 허둥대고 있었다.'},
{s:1,t:'iikae',q:'この件は<u>ひとまず</u>保留にしよう。',o:['とりあえず','結局','ずっと','すぐに'],e:'ひとまず = 일단 → とりあえず.',tr:'이 건은 일단 보류하자.'},
{s:1,t:'iikae',q:'彼は私の提案に<u>ことごとく</u>反対した。',o:['すべてに','ときどき','少しだけ','強く'],e:'ことごとく(悉く) = 모조리, 하나도 빠짐없이 → すべて.',tr:'그는 내 제안에 모조리 반대했다.'},
{s:1,t:'iikae',q:'引っ越しの後、部屋の中は<u>がらんとして</u>いた。',o:['何もなくて広々として','散らかって','薄暗くて','湿っぽくて'],e:'がらんとする = 텅 비어 휑하다.',tr:'이사 후 방 안은 텅 비어 있었다.'},

{s:1,t:'yoho',q:'手分け',o:['人数が多いので、手分けして資料を探しましょう。','彼は手分けして高い給料をもらっている。','ケーキを手分けして8つに切った。','この問題は手分けが難しく、誰にも解けない。'],e:'手分け(てわけ) = 여럿이 일을 나누어 맡음. 케이크를 나누는 것은 切り分ける.',tr:'인원이 많으니 분담해서 자료를 찾읍시다.'},
{s:1,t:'yoho',q:'打ち明ける',o:['長年の悩みを親友に打ち明けた。','新しい店が駅前に打ち明けた。','窓を打ち明けて空気を入れ替えた。','試合は延長戦の末、ようやく打ち明けた。'],e:'打ち明ける = (비밀·고민을) 털어놓다. 가게 개점은 開店する, 창문은 開ける.',tr:'오랜 고민을 친한 친구에게 털어놓았다.'},
{s:1,t:'yoho',q:'目覚ましい',o:['彼女の英語力は目覚ましい進歩を遂げた。','毎朝、目覚ましい時計で起きる。','隣の工事の音が目覚ましくて眠れない。','目覚ましい天気で、洗濯物がよく乾いた。'],e:'目覚ましい = 눈부시다(발전·활약). 알람시계는 目覚まし時計.',tr:'그녀의 영어 실력은 눈부신 진보를 이루었다.'},
{s:1,t:'yoho',q:'差し支える',o:['夜更かしすると、翌日の仕事に差し支える。','彼の意見に差し支えて、反論した。','重い荷物を差し支えて運んだ。','道が差し支えて、車が動かない。'],e:'差し支える = 지장이 생기다. 「～に差し支える」.',tr:'밤을 새우면 다음 날 일에 지장이 생긴다.'},
{s:1,t:'yoho',q:'発足',o:['来月、新しい研究会が発足する。','新幹線が東京駅を発足した。','彼は朝早く会社へ発足した。','火山が発足する危険がある。'],e:'発足(ほっそく) = 조직·제도가 새로 만들어져 활동을 시작함. 열차 출발은 発車, 화산은 噴火.',tr:'다음 달 새로운 연구회가 발족한다.'},
{s:1,t:'yoho',q:'怠る',o:['安全確認を怠ったことが事故の原因だ。','疲れていたので、ソファで少し怠った。','雨が降ったので、試合を怠った。','彼は怠って一日中働き続けた。'],e:'怠る(おこたる) = (해야 할 일을) 게을리하다. 쉬는 것은 休む, 중지는 中止する.',tr:'안전 확인을 게을리한 것이 사고의 원인이다.'},

{s:1,t:'bunpo',q:'社長（　）、自分の判断一つで会社の運命が左右される。',o:['ともなると','ともなく','とあって','としたら'],e:'N+ともなると = ~쯤 되면(지위·단계가 높아지면 당연히). ともなく=무심코.',tr:'사장쯤 되면 자신의 판단 하나로 회사의 운명이 좌우된다.'},
{s:1,t:'bunpo',q:'親の反対（　）、彼は留学を決めた。',o:['をよそに','をもとに','をめぐって','を通じて'],e:'をよそに = ~을 아랑곳하지 않고. をめぐって=~을 둘러싸고.',tr:'부모의 반대를 아랑곳하지 않고 그는 유학을 결정했다.'},
{s:1,t:'bunpo',q:'本日（　）、当店は閉店いたします。長らくのご愛顧、ありがとうございました。',o:['をもって','をおいて','をよそに','をこめて'],e:'をもって = ~으로써(기한의 끝). 공지문의 단골 표현.',tr:'오늘로써 저희 가게는 폐점합니다. 오랫동안 애용해 주셔서 감사합니다.'},
{s:1,t:'bunpo',q:'ドアを開ける（　）、猫が部屋に飛び込んできた。',o:['や否や','ものの','からには','うちに'],e:'V辞書形+や否や = ~하자마자. とたん은 た형에 접속하므로 「開けたとたん」이 된다.',tr:'문을 열자마자 고양이가 방으로 뛰어들어 왔다.'},
{s:1,t:'bunpo',q:'生徒に暴言を吐くなど、教師に（　）行為だ。',o:['あるまじき','あるべく','あらんがため','あらずもがな'],e:'Nにあるまじき = ~로서 있어서는 안 될.',tr:'학생에게 폭언을 하다니, 교사로서 있어서는 안 될 행위다.'},
{s:1,t:'bunpo',q:'試験に合格せん（　）、毎晩遅くまで勉強している。',o:['がため','ばかりに','ものを','までも'],e:'Vない+んがため = ~하기 위해(문어). する→せんがため.',tr:'시험에 합격하기 위해 매일 밤늦게까지 공부하고 있다.'},
{s:1,t:'bunpo',q:'会社の経営が苦しい今、一円（　）無駄にはできない。',o:['たりとも','ごとき','ばかりか','ならでは'],e:'一+조수사+たりとも～ない = 단 ~도 ~않다.',tr:'회사 경영이 어려운 지금, 단 1엔도 낭비할 수 없다.'},
{s:1,t:'bunpo',q:'彼女の歌声は、聴く人の心を動かさず（　）。',o:['にはおかない','にはいられない','ともかまわない','じまいだ'],e:'ずにはおかない = (주체가 대상을) 반드시 ~하게 만든다. ずにはいられない는 화자 자신의 감정(~하지 않을 수 없다)이라 주어가 歌声인 문장에는 맞지 않다.',tr:'그녀의 노랫소리는 듣는 사람의 마음을 움직이지 않고는 못 배긴다.'},
{s:1,t:'bunpo',q:'想像する（　）恐ろしい事件だった。',o:['だに','すら','まで','こそ'],e:'V辞書形+だに = ~하는 것만으로도. すら는 동사에 직접 붙지 않는다(「想像することすら」).',tr:'상상하는 것만으로도 무서운 사건이었다.'},
{s:1,t:'bunpo',q:'言ってくれれば手伝った（　）、どうして黙っていたの。',o:['ものを','ものの','もので','ものなら'],e:'～ものを = ~했을 텐데(불만·유감). ものの=~지만.',tr:'말해 줬으면 도와줬을 텐데, 왜 가만히 있었어?'},

{s:1,t:'narabe',q:'この仕事を任せられるのは、経験豊富な ＿＿ ＿＿ ★ ＿＿ いない。',o:['おいて','田中さん','を','他に'],e:'정답 순서: 田中さん を おいて 他に → 「経験豊富な田中さんをおいて他にいない」(경험이 풍부한 다나카 씨를 빼고는 아무도 없다). ★=おいて',tr:'이 일을 맡길 수 있는 것은 경험이 풍부한 다나카 씨 말고는 없다.'},
{s:1,t:'narabe',q:'忙しくて ＿＿ ★ ＿＿ ＿＿ ない。',o:['する','食事を','時間','すら'],e:'정답 순서: 食事を する 時間 すら → 「忙しくて食事をする時間すらない」. ★=する',tr:'바빠서 식사할 시간조차 없다.'},
{s:1,t:'narabe',q:'＿＿ ★ ＿＿ ＿＿ どこも混雑していた。',o:['と','連休','あって','観光地は'],e:'정답 순서: 連休 と あって 観光地は → 「連休とあって観光地はどこも混雑していた」. ★=と',tr:'연휴라서 관광지는 어디나 붐볐다.'},
{s:1,t:'narabe',q:'＿＿ ＿＿ ＿＿ ★ 現地へ向かった。',o:['記者は','事実を','確かめる','べく'],e:'정답 순서: 事実を 確かめる べく 記者は → 「事実を確かめるべく記者は現地へ向かった」. ★=記者は',tr:'사실을 확인하기 위해 기자는 현지로 향했다.'},
{s:1,t:'narabe',q:'彼は ＿＿ ★ ＿＿ ＿＿ 言ってはばからない。',o:['業界一の','自分こそが','職人だ','と'],e:'정답 순서: 自分こそが 業界一の 職人だ と → 「自分こそが業界一の職人だと言ってはばからない」. ★=業界一の',tr:'그는 자기야말로 업계 최고의 장인이라고 거리낌 없이 말한다.'},

// ===== SET 2 =====
{s:2,t:'kanji',q:'与えられた任務を最後まで<u>遂行</u>する。',o:['すいこう','ついこう','すいぎょう','ついぎょう'],e:'遂行(すいこう) 수행. 遂げる(とげる)의 음독은 「すい」.',tr:'주어진 임무를 끝까지 수행한다.'},
{s:2,t:'kanji',q:'赤字が続き、会社の<u>存続</u>が危ぶまれている。',o:['そんぞく','ぞんぞく','そんしょく','ぞんしょく'],e:'存続(そんぞく) 존속. 存은 「そん/ぞん」 두 음 — 存在(そんざい), 存分(ぞんぶん).',tr:'적자가 계속되어 회사의 존속이 위태로워지고 있다.'},
{s:2,t:'kanji',q:'彼は<u>巧みな</u>話術で人を引きつける。',o:['たくみな','しくみな','こうみな','たくましな'],e:'巧み(たくみ) 교묘함, 능숙함. 巧妙(こうみょう)와 혼동 주의.',tr:'그는 능숙한 화술로 사람을 끌어들인다.'},
{s:2,t:'kanji',q:'両者の意見の<u>相違</u>が明らかになった。',o:['そうい','そうち','しょうい','あいい'],e:'相違(そうい) 차이, 상이.',tr:'양측 의견의 차이가 분명해졌다.'},
{s:2,t:'kanji',q:'無理がたたって体調を<u>損ねて</u>しまった。',o:['そこねて','そんねて','かさねて','おとねて'],e:'損ねる(そこねる) 해치다, 상하게 하다.',tr:'무리한 탓에 몸 상태를 해치고 말았다.'},
{s:2,t:'kanji',q:'小さな誤解が、両国の対立の<u>発端</u>となった。',o:['ほったん','はったん','はつたん','ほつたん'],e:'発端(ほったん) 발단. 発을 「ほっ」으로 읽는 단어: 発作(ほっさ), 発足(ほっそく).',tr:'작은 오해가 양국 대립의 발단이 되었다.'},

{s:2,t:'bunmyaku',q:'彼は周囲の期待に（　）、見事に優勝した。',o:['応え','叶え','満たし','果たし'],e:'期待に応える(こたえる) = 기대에 부응하다. 叶える・満たす・果たす는 「～を」를 취한다.',tr:'그는 주위의 기대에 부응해 멋지게 우승했다.'},
{s:2,t:'bunmyaku',q:'この地域では、人口の減少に（　）がかからない。',o:['歯止め','足止め','口止め','差し止め'],e:'歯止めがかからない = 제동이 걸리지 않다. 足止め=발이 묶임, 口止め=입막음.',tr:'이 지역에서는 인구 감소에 제동이 걸리지 않는다.'},
{s:2,t:'bunmyaku',q:'彼の提案は斬新だが、実現性に（　）。',o:['欠ける','欠かす','抜ける','外れる'],e:'～に欠ける = ~이 부족하다(자동사). 欠かす는 「～を欠かす」.',tr:'그의 제안은 참신하지만 실현 가능성이 부족하다.'},
{s:2,t:'bunmyaku',q:'雨が降り続き、工事の進行に（　）が出ている。',o:['支障','保障','故障','補償'],e:'支障が出る = 지장이 생기다. 故障는 기계 고장.',tr:'비가 계속 내려 공사 진행에 지장이 생기고 있다.'},
{s:2,t:'bunmyaku',q:'予想外の質問に、彼は答えに（　）。',o:['窮した','極めた','究めた','急いだ'],e:'答えに窮する(きゅうする) = 대답이 궁해지다. 極める・究める=끝까지 다하다.',tr:'예상 밖의 질문에 그는 대답이 궁해졌다.'},
{s:2,t:'bunmyaku',q:'社長の（　）で、議論が続いていた計画は中止になった。',o:['鶴の一声','猫の手','馬の耳に念仏','虎の巻'],e:'鶴の一声 = 권위자의 한마디(로 결정됨). 猫の手も借りたい=몹시 바쁘다.',tr:'사장의 한마디로 논의가 계속되던 계획은 중지되었다.'},
{s:2,t:'bunmyaku',q:'彼女は相手の地位に関係なく、誰に対しても（　）態度で接する。',o:['分け隔てない','見境ない','抜け目ない','心ない'],e:'分け隔てない = 차별 없는. 見境ない=분별없는, 抜け目ない=빈틈없는(약삭빠른), 心ない=몰인정한.',tr:'그녀는 상대의 지위에 관계없이 누구에게나 차별 없는 태도로 대한다.'},

const READ=[
{s:1,k:'内容理解（短文）',title:'便利さと思考',text:'「便利さ」は、私たちから考える時間を奪っているのかもしれない。道に迷えばスマートフォンが道順を示し、言葉の意味がわからなければ、検索すれば数秒で答えが出る。かつては地図を広げ、周りの景色と照らし合わせながら自分の位置を推測したものだ。その過程で、私たちは自然と空間を把握する力を身につけていた。\n便利な道具を否定するつもりはない。しかし、答えにたどり着くまでの回り道にこそ、思考を鍛える機会が潜んでいることを忘れてはならない。',
tr:'\'편리함\'은 우리에게서 생각할 시간을 빼앗고 있는지도 모른다. 길을 잃으면 스마트폰이 길을 알려 주고, 말의 뜻을 모르면 검색하면 몇 초 만에 답이 나온다. 예전에는 지도를 펼쳐 주변 풍경과 대조하면서 자신의 위치를 추측하곤 했다. 그 과정에서 우리는 자연스럽게 공간을 파악하는 능력을 익혔다.\n편리한 도구를 부정할 생각은 없다. 그러나 답에 이르기까지의 돌아가는 길에야말로 사고를 단련할 기회가 숨어 있다는 것을 잊어서는 안 된다.',
qs:[{q:'筆者の考えに合うものはどれか。',o:['答えを得るまでの過程には、考える力を育てる価値がある。','スマートフォンは思考力を低下させるので、使うべきではない。','地図を使えば、誰でも空間を把握する力が身につく。','便利な道具は時間を短くするだけで、役に立たない。'],e:'마지막 문장 「回り道にこそ、思考を鍛える機会が潜んでいる」가 핵심. 「便利な道具を否定するつもりはない」이므로 2·4번은 오답.'}]},

{s:1,k:'内容理解（中文）',title:'職場の雑談',text:'近年、テレワークの普及によって職場での雑談が減ったという声をよく耳にする。業務に直接関係のない会話は、一見すると無駄な時間のように思えるかもしれない。実際、効率を重視するあまり、雑談を控えるよう求める企業もあったという。\nしかし、ある調査によれば、雑談の多いチームほど新しいアイデアが生まれやすく、問題が起きた際の対応も早い傾向があるそうだ。何気ない会話を通して互いの人柄や得意分野を知っていれば、困ったときに誰に相談すればよいかがすぐにわかる。また、ちょっとした違和感を気軽に口にできる雰囲気は、大きなミスを未然に防ぐことにもつながる。\nつまり、雑談は単なる息抜きではなく、組織の土台を支える「見えない仕組み」なのである。オンラインでも雑談の機会を意識的に設けることが、これからの職場には求められているのではないだろうか。',
tr:'최근 재택근무의 보급으로 직장에서의 잡담이 줄었다는 말을 자주 듣는다. 업무와 직접 관계없는 대화는 언뜻 보면 쓸데없는 시간처럼 생각될지도 모른다. 실제로 효율을 중시한 나머지 잡담을 자제하도록 요구한 기업도 있었다고 한다.\n그러나 어느 조사에 따르면 잡담이 많은 팀일수록 새로운 아이디어가 나오기 쉽고, 문제가 생겼을 때의 대응도 빠른 경향이 있다고 한다. 무심한 대화를 통해 서로의 인품이나 잘하는 분야를 알고 있으면, 곤란할 때 누구에게 상담하면 좋을지 금방 알 수 있다. 또 사소한 위화감을 부담 없이 말할 수 있는 분위기는 큰 실수를 미연에 방지하는 것으로도 이어진다.\n즉 잡담은 단순한 휴식이 아니라 조직의 토대를 떠받치는 \'보이지 않는 구조\'인 것이다. 온라인에서도 잡담의 기회를 의식적으로 마련하는 것이 앞으로의 직장에는 요구되고 있는 것이 아닐까.',
qs:[{q:'雑談の多いチームについて、調査で何がわかったか。',o:['新しいアイデアが出やすく、問題への対応が早い。','業務の効率が下がり、ミスが増える。','メンバー同士の対立が起きやすい。','テレワークを好むメンバーが多い。'],e:'둘째 단락 첫 문장에 조사 결과가 그대로 나온다.'},
{q:'「見えない仕組み」とはどういうことか。',o:['雑談が、目立たないが組織を支える働きをしているということ','雑談は上司に知られないように行うべきだということ','雑談の効果は調査でも確認できないということ','組織の規則には雑談に関する決まりがないということ'],e:'「単なる息抜きではなく、組織の土台を支える」→ 눈에 띄지 않지만 조직을 떠받치는 기능.'},
{q:'筆者が最も言いたいことは何か。',o:['オンラインでも意識的に雑談の場を作るべきだ。','効率のためには雑談を減らすべきだ。','テレワークをやめて出社すべきだ。','雑談は休憩時間だけに限るべきだ。'],e:'마지막 문장 「オンラインでも雑談の機会を意識的に設けることが…求められている」가 주장.'}]},

{s:1,k:'主張理解（長文）',title:'「わかりやすさ」の落とし穴',text:'最近、「わかりやすさ」がもてはやされている。テレビの解説も、ビジネス書も、複雑な事柄をいかに短く、明快に伝えるかを競っているようだ。確かに、難解な専門用語を並べるだけの説明よりは、わかりやすい説明のほうが親切だろう。\nだが、私はこの風潮に一抹の不安を覚える。世の中の多くの問題は、本来、単純な答えが出せるものではない。それを無理にわかりやすく切り取れば、こぼれ落ちるものが必ずある。しかも、受け手は「わかった」という満足感を得てしまうため、こぼれ落ちたものの存在に気づくことすらない。\nわかりにくいものに出会ったとき、人は立ち止まり、考え、別の資料に当たろうとする。そのもどかしい時間こそが、物事を多面的に捉える力を育てるのではないか。すぐにはわからないことに耐える力、それを私は「知的な体力」と呼びたい。\nわかりやすさを求めること自体が悪いのではない。問題は、わかりやすさだけを求め、わかりにくさから逃げてしまうことである。私たちは時に、あえて難しい本を手に取り、答えの出ない問いと向き合う必要があるのだ。',
tr:'최근 \'알기 쉬움\'이 각광받고 있다. 텔레비전 해설도, 비즈니스 서적도 복잡한 사안을 얼마나 짧고 명쾌하게 전달하는지를 경쟁하고 있는 듯하다. 확실히 난해한 전문 용어를 늘어놓기만 하는 설명보다는 알기 쉬운 설명이 친절할 것이다.\n하지만 나는 이 풍조에 일말의 불안을 느낀다. 세상의 많은 문제는 본래 단순한 답을 낼 수 있는 것이 아니다. 그것을 억지로 알기 쉽게 잘라 내면 반드시 흘러 떨어지는 것이 있다. 게다가 받아들이는 쪽은 \'알았다\'는 만족감을 얻어 버리기 때문에 흘러 떨어진 것의 존재조차 알아차리지 못한다.\n이해하기 어려운 것을 만났을 때 사람은 멈춰 서서 생각하고, 다른 자료를 찾아보려 한다. 그 답답한 시간이야말로 사물을 다면적으로 파악하는 힘을 기르는 것이 아닐까. 바로 이해되지 않는 것을 견디는 힘, 그것을 나는 \'지적 체력\'이라 부르고 싶다.\n알기 쉬움을 추구하는 것 자체가 나쁜 것은 아니다. 문제는 알기 쉬움만을 추구하고 이해하기 어려움으로부터 도망쳐 버리는 것이다. 우리는 때로 일부러 어려운 책을 손에 들고, 답이 나오지 않는 물음과 마주할 필요가 있는 것이다.',
qs:[{q:'筆者が「不安を覚える」のはなぜか。',o:['単純化によって失われたものに、受け手が気づかなくなるから','専門用語を使った説明が増えているから','わかりやすい説明ができる人が少ないから','テレビの解説が短すぎて理解できないから'],e:'「受け手は『わかった』という満足感を得てしまうため、こぼれ落ちたものの存在に気づくことすらない」.'},
{q:'「知的な体力」とは何か。',o:['すぐに理解できないことに向き合い続ける力','難しい本を速く読む力','物事をわかりやすく説明する力','多くの資料を短時間で集める力'],e:'바로 앞 「すぐにはわからないことに耐える力」를 가리킨다.'},
{q:'筆者の主張に合うものはどれか。',o:['わかりやすさだけでなく、わかりにくさに向き合うことも大切だ。','わかりやすい説明は、受け手に対して不親切だ。','世の中の問題には、必ず単純な答えがある。','難しい本以外は読むべきではない。'],e:'마지막 단락: 알기 쉬움 자체는 나쁘지 않으나, 어려움에서 도망치지 말아야 한다.'}]},

{s:2,k:'内容理解（短文）',title:'研修日程変更のお知らせ',text:'件名：情報セキュリティ研修　日程変更のお知らせ\n社員各位\n先日ご案内いたしました情報セキュリティ研修につきまして、講師の都合により、日程を下記のとおり変更いたします。\n旧日程：11月18日（水）14:00～16:00\n新日程：11月25日（水）10:00～12:00\n会場に変更はございません。なお、新日程でのご参加が難しい方は、11月20日までに総務部までご連絡ください。後日、録画を視聴していただく形で受講扱いといたします。\n総務部　山田',
tr:'제목: 정보 보안 연수 일정 변경 안내\n사원 여러분께\n얼마 전 안내드린 정보 보안 연수에 대해, 강사 사정으로 일정을 아래와 같이 변경합니다.\n기존 일정: 11월 18일(수) 14:00~16:00\n새 일정: 11월 25일(수) 10:00~12:00\n장소는 변경 없습니다. 또한 새 일정에 참가가 어려운 분은 11월 20일까지 총무부로 연락해 주십시오. 추후 녹화 영상을 시청하는 방식으로 수강 처리하겠습니다.\n총무부 야마다',
qs:[{q:'新しい日程に参加できない人は、どうしなければならないか。',o:['11月20日までに総務部に連絡し、後日録画を見る','11月18日の研修に参加する','講師に直接連絡して日程を相談する','研修を受けなくてもよいので、何もしない'],e:'「新日程でのご参加が難しい方は、11月20日までに総務部までご連絡ください。後日、録画を視聴…」'}]},

{s:2,k:'統合理解（A・B）',title:'小学生とスマートフォン',text:'【A】\n小学生にスマートフォンを持たせることには賛成だ。共働きの家庭が増え、子供と連絡を取る手段は欠かせない。また、デジタル機器に早くから慣れておくことは、将来必ず役に立つ。問題は使い方であり、家庭でルールを決めれば、トラブルの多くは防げるはずだ。\n【B】\n小学生のスマートフォン所持には慎重であるべきだ。連絡手段が必要なら、通話機能だけの端末で十分だろう。子供が自分で利用時間を管理するのは、大人が考える以上に難しく、ルールを決めても守られないことが多い。依存や犯罪被害の危険を考えれば、急ぐ必要はない。',
tr:'【A】\n초등학생에게 스마트폰을 쥐여 주는 것에 찬성한다. 맞벌이 가정이 늘어 아이와 연락할 수단은 필수다. 또 디지털 기기에 일찍부터 익숙해지는 것은 장래에 반드시 도움이 된다. 문제는 사용법이며, 가정에서 규칙을 정하면 문제의 대부분은 막을 수 있을 것이다.\n【B】\n초등학생의 스마트폰 소지에는 신중해야 한다. 연락 수단이 필요하다면 통화 기능만 있는 단말기로 충분할 것이다. 아이가 스스로 사용 시간을 관리하는 것은 어른이 생각하는 이상으로 어렵고, 규칙을 정해도 지켜지지 않는 경우가 많다. 의존이나 범죄 피해의 위험을 생각하면 서두를 필요는 없다.',
qs:[{q:'AとBが共通して触れている点は何か。',o:['子供との連絡手段の必要性','デジタル機器に慣れる利点','犯罪被害の具体例','学校での使用禁止'],e:'A 「連絡を取る手段は欠かせない」, B 「連絡手段が必要なら…」 — 둘 다 연락 수단을 언급.'},
{q:'家庭でのルールについて、AとBはどう考えているか。',o:['Aはルールでトラブルを防げると考え、Bはルールが守られにくいと考えている。','AもBも、ルールを決めれば問題ないと考えている。','Aはルールは不要だと考え、Bは必要だと考えている。','AもBも、ルールについては触れていない。'],e:'A 「ルールを決めれば、トラブルの多くは防げる」 vs B 「ルールを決めても守られないことが多い」.'}]},

{s:2,k:'主張理解（長文）',title:'「住む」より先に「関わる」',text:'人口減少に悩む地方にとって、移住者を増やすことは長年の課題であった。各地の自治体は住宅の補助や就職支援など、さまざまな制度を設けて移住を呼びかけてきた。しかし、生活の拠点を丸ごと移すという決断は、多くの人にとって容易ではない。仕事、家族、人間関係――都市で築いてきたものを手放すには、相当の覚悟が要る。\nそこで近年注目されているのが「関係人口」という考え方である。これは、移住はしないものの、特定の地域に繰り返し訪れたり、離れた場所から地域の活動を支えたりする人々を指す。たとえば、週末ごとに農作業を手伝いに来る会社員や、ふるさと納税をきっかけにその町の祭りの運営に関わるようになった人などがそれにあたる。\n関係人口の意義は、単に地域にお金を落とすことにとどまらない。外から来た人の視点は、住民が当たり前だと思っていた風景や文化に新たな価値を見いだすきっかけになる。また、こうした緩やかな関わりが、やがて移住につながる例も少なくない。いきなり「住む」ことを求めるのではなく、まず「関わる」入り口を広く用意する。地域の未来は、その発想の転換にかかっているのではないだろうか。',
tr:'인구 감소로 고민하는 지방에게 이주자를 늘리는 것은 오랜 과제였다. 각지의 지자체는 주택 보조나 취업 지원 등 다양한 제도를 마련해 이주를 호소해 왔다. 그러나 생활 거점을 통째로 옮긴다는 결단은 많은 사람에게 쉽지 않다. 일, 가족, 인간관계——도시에서 쌓아 온 것을 놓아 버리려면 상당한 각오가 필요하다.\n그래서 최근 주목받고 있는 것이 \'관계 인구\'라는 사고방식이다. 이는 이주는 하지 않지만 특정 지역을 반복해서 방문하거나, 떨어진 곳에서 지역 활동을 지원하는 사람들을 가리킨다. 예를 들어 주말마다 농사일을 도우러 오는 회사원이나, 고향 납세를 계기로 그 마을 축제 운영에 관여하게 된 사람 등이 이에 해당한다.\n관계 인구의 의의는 단순히 지역에 돈을 쓰는 것에 그치지 않는다. 밖에서 온 사람의 시선은 주민이 당연하게 여기던 풍경이나 문화에서 새로운 가치를 발견하는 계기가 된다. 또 이러한 느슨한 관계가 머지않아 이주로 이어지는 예도 적지 않다. 갑자기 \'사는\' 것을 요구하는 것이 아니라 먼저 \'관계 맺는\' 입구를 넓게 마련한다. 지역의 미래는 그 발상의 전환에 달려 있는 것이 아닐까.',
qs:[{q:'筆者によると、移住が進まない理由は何か。',o:['都市で築いた生活の基盤を手放すのが難しいから','自治体の支援制度が不十分だから','地方には仕事がまったくないから','地方の住民が移住者を歓迎しないから'],e:'「都市で築いてきたものを手放すには、相当の覚悟が要る」.'},
{q:'「関係人口」にあたるのはどれか。',o:['毎月その町を訪れ、イベントの準備を手伝う都市在住者','その町に引っ越して農業を始めた人','一度だけ観光でその町を訪れた人','その町で生まれ育ち、ずっと住んでいる人'],e:'이주하지 않고 반복적으로 방문·지원하는 사람. 2번은 이주자, 3번은 반복 방문 아님.'},
{q:'筆者の考えに合うものはどれか。',o:['移住を求める前に、地域に関わる機会を広く作るべきだ。','関係人口は地域経済にしか貢献しない。','移住支援制度はすべて廃止すべきだ。','外部の人の意見は地域の文化を壊す。'],e:'「いきなり『住む』ことを求めるのではなく、まず『関わる』入り口を広く用意する」.'}]}
];

{s:1,k:'kadai',intro:'会社で男の人と女の人が話しています。男の人はこのあとまず何をしなければなりませんか。',q:'男の人はこのあとまず何をしなければなりませんか。',
lines:[['F','田中さん、来週の取引先との会議の件だけど、資料はもうできてる？'],['M','はい、ほぼ完成しています。あとはグラフを最新のデータに差し替えるだけです。'],['F','そう。それから、先方から出席者が一人増えるって連絡があったの。今の会議室だと狭いかもしれないわね。'],['M','あ、そうですか。では、大きい部屋が空いているか確認します。'],['F','ううん、それは私がさっき総務に聞いておいたから大丈夫。第二会議室が取れたわ。それより、出席者が増えるなら資料の部数も足りないでしょう。'],['M','そうですね。でも、印刷は前日でいいですよね。グラフを直してから印刷します。'],['F','ええ。あ、でもその前に、増えた方のお名前と役職を先方に確認してもらえる？名札を作らなきゃいけないから、今日中に返事がほしいの。'],['M','わかりました。すぐにメールします。']],
o:['取引先に出席者の名前と役職を確認する','グラフを最新のデータに差し替える','大きい会議室を予約する','資料を印刷する'],
tr:'(회사에서 남자와 여자가 이야기하고 있습니다. 남자는 이후 먼저 무엇을 해야 합니까?)\n여: 다나카 씨, 다음 주 거래처와의 회의 건 말인데, 자료는 다 됐어?\n남: 네, 거의 완성했습니다. 이제 그래프를 최신 데이터로 바꾸기만 하면 됩니다.\n여: 그래. 그리고 상대측에서 참석자가 한 명 늘어난다고 연락이 왔어. 지금 회의실로는 좁을지도 모르겠네.\n남: 아, 그래요? 그럼 큰 방이 비어 있는지 확인하겠습니다.\n여: 아니, 그건 내가 아까 총무에 물어봐서 괜찮아. 제2회의실을 잡았어. 그보다 참석자가 늘면 자료 부수도 모자라겠지.\n남: 그렇네요. 그래도 인쇄는 전날 해도 되죠? 그래프를 고친 다음에 인쇄하겠습니다.\n여: 응. 아, 그런데 그 전에 늘어난 분의 성함과 직책을 상대측에 확인해 줄래? 명찰을 만들어야 하니까 오늘 중으로 답을 받고 싶어.\n남: 알겠습니다. 바로 메일 보내겠습니다.',
e:'「その前に」「今日中に返事がほしい」가 핵심 → 가장 먼저 거래처에 확인 메일. 회의실은 여자가 이미 확보, 인쇄는 전날, 그래프는 인쇄 전에.'},

{s:1,k:'kadai',intro:'大学で女の学生と先生が話しています。女の学生はレポートをどのように直しますか。',q:'女の学生はレポートをどのように直しますか。',
lines:[['F','先生、先日提出したレポートのことなんですが……。'],['M','ああ、読みましたよ。テーマの選び方はいいと思います。データもよく集めていますね。'],['F','ありがとうございます。'],['M','ただ、結論の部分が少し弱いかな。集めたデータから何が言えるのか、自分の意見がはっきり書かれていない。'],['F','そうですか。データをもっと増やしたほうがいいでしょうか。'],['M','いや、量は今のままで十分です。それより、データの分析結果と自分の主張をきちんと結びつけて書くこと。それから、参考文献の書き方も統一してください。'],['F','はい、わかりました。']],
o:['分析結果をもとに結論で自分の意見を明確にし、参考文献の書き方を統一する','データを増やして、結論を書き直す','テーマを変えて、新しくデータを集める','参考文献を増やし、結論を短くする'],
tr:'(대학에서 여학생과 선생님이 이야기하고 있습니다. 여학생은 리포트를 어떻게 고칩니까?)\n여: 선생님, 얼마 전에 제출한 리포트 말인데요…….\n남: 아, 읽었어요. 주제 선정은 좋다고 생각해요. 데이터도 잘 모았네요.\n여: 감사합니다.\n남: 다만 결론 부분이 조금 약한 것 같아요. 모은 데이터로 무엇을 말할 수 있는지, 자신의 의견이 분명하게 쓰여 있지 않아요.\n여: 그래요? 데이터를 더 늘리는 게 좋을까요?\n남: 아니, 양은 지금 그대로 충분해요. 그보다 데이터 분석 결과와 자신의 주장을 제대로 연결해서 쓸 것. 그리고 참고 문헌 쓰는 방법도 통일해 주세요.\n여: 네, 알겠습니다.',
e:'데이터 양은 「今のままで十分」. 고칠 것은 ① 분석 결과와 주장을 연결한 결론 ② 참고 문헌 표기 통일.'},

{s:1,k:'point',intro:'ラジオで女の人が話しています。女の人は、新しい図書館の一番の特徴は何だと言っていますか。',q:'女の人は、新しい図書館の一番の特徴は何だと言っていますか。',
lines:[['F','来月オープンする市立図書館は、蔵書数が県内最大級ということで話題になっていますが、私が実際に見学して最も印象に残ったのは、「話してもいいエリア」が設けられていることです。従来の図書館は静かに過ごす場所というイメージでしたが、ここでは、グループで議論しながら調べものをしたり、子供に絵本を読み聞かせたりすることができます。もちろん、静かに読書をしたい人のための部屋も別に用意されています。カフェも併設されていますが、それよりも、図書館を「人が集まり、交流する場所」に変えようという試みこそ、この図書館の最大の魅力だと感じました。']],
o:['会話をしながら利用できる場所があること','蔵書数が県内で最も多いこと','カフェが併設されていること','静かに読書できる部屋があること'],
tr:'(라디오에서 여자가 이야기하고 있습니다. 여자는 새 도서관의 가장 큰 특징이 무엇이라고 말하고 있습니까?)\n여: 다음 달 문을 여는 시립 도서관은 장서 수가 현 내 최대급이라는 점에서 화제가 되고 있습니다만, 제가 실제로 견학하고 가장 인상에 남은 것은 \'이야기해도 되는 구역\'이 마련되어 있다는 점입니다. 기존 도서관은 조용히 지내는 곳이라는 이미지였지만, 이곳에서는 그룹으로 토론하면서 자료를 찾거나 아이에게 그림책을 읽어 주거나 할 수 있습니다. 물론 조용히 독서하고 싶은 사람을 위한 방도 따로 마련되어 있습니다. 카페도 함께 있지만, 그보다도 도서관을 \'사람이 모이고 교류하는 곳\'으로 바꾸려는 시도야말로 이 도서관의 가장 큰 매력이라고 느꼈습니다.',
e:'「最も印象に残ったのは」「～こそ、最大の魅力」 → 대화 가능한 구역. 장서 수·카페는 \'それよりも\'로 부정됨.'},

{s:1,k:'point',intro:'男の人と女の人が話しています。男の人が引っ越しをする一番の理由は何ですか。',q:'男の人が引っ越しをする一番の理由は何ですか。',
lines:[['F','引っ越すんだって？今のマンション、駅から近くて便利だって言ってたじゃない。'],['M','うん、便利なのは確かなんだけどね。家賃も手頃だし。'],['F','じゃあ、どうして？隣の人がうるさいとか？'],['M','いや、隣は静かだよ。実は、来年から在宅勤務が中心になるんだ。今の部屋は狭くて、仕事用の机を置く場所がなくてさ。'],['F','なるほど。通勤しないなら、駅から遠くてもいいもんね。'],['M','そうなんだよ。その分、広い部屋に住めるしね。']],
o:['仕事をするための場所が必要だから','駅から遠い所に住みたいから','家賃が高いから','隣の人がうるさいから'],
tr:'(남자와 여자가 이야기하고 있습니다. 남자가 이사하는 가장 큰 이유는 무엇입니까?)\n여: 이사한다며? 지금 아파트, 역에서 가까워서 편하다고 했잖아.\n남: 응, 편한 건 확실한데. 월세도 적당하고.\n여: 그럼 왜? 옆집 사람이 시끄럽다든가?\n남: 아니, 옆집은 조용해. 실은 내년부터 재택근무가 중심이 되거든. 지금 방은 좁아서 업무용 책상을 놓을 데가 없어서.\n여: 그렇구나. 출근 안 하면 역에서 멀어도 되겠네.\n남: 맞아. 그만큼 넓은 방에서 살 수 있고.',
e:'「実は」 뒤가 진짜 이유: 재택근무 → 책상 놓을 공간 필요. 역에서 먼 것은 결과일 뿐.'},

{s:1,k:'gaiyo',intro:'テレビで男の人が話しています。',q:'男の人は何について話していますか。',
lines:[['M','「もったいない」という言葉がありますね。まだ使えるものを捨てるのは惜しい、という気持ちを表す言葉です。最近、この考え方が改めて見直されています。食品ロスの問題がその一例です。日本では、まだ食べられるのに捨てられる食品が、年間数百万トンにのぼると言われています。こうした中、賞味期限の近い商品を割引して販売する店や、余った食材を必要な人に届ける活動が広がっています。一人一人が買いすぎない、作りすぎないことを意識するだけでも、状況は大きく変わるはずです。']],
o:['食品を無駄にしないための取り組みと心がけ','「もったいない」という言葉の語源','賞味期限の正しい決め方','割引商品を上手に買う方法'],
tr:'(텔레비전에서 남자가 이야기하고 있습니다.)\n남: \'못타이나이(아깝다)\'라는 말이 있죠. 아직 쓸 수 있는 것을 버리는 것은 아깝다는 마음을 나타내는 말입니다. 최근 이 사고방식이 다시 주목받고 있습니다. 식품 손실 문제가 그 한 예입니다. 일본에서는 아직 먹을 수 있는데도 버려지는 식품이 연간 수백만 톤에 이른다고 합니다. 이런 가운데 유통기한이 임박한 상품을 할인 판매하는 가게나, 남은 식재료를 필요한 사람에게 전달하는 활동이 확산되고 있습니다. 한 사람 한 사람이 너무 많이 사지 않고, 너무 많이 만들지 않는 것을 의식하는 것만으로도 상황은 크게 달라질 것입니다.\n(질문: 남자는 무엇에 대해 이야기하고 있습니까?)',
e:'개요 이해: 전체 흐름 = 식품 손실 문제 → 대처 활동 → 개인의 의식. 어원·구매 요령은 일부 소재일 뿐.'},

{s:1,k:'sokuji',lines:[['F','部長、例の件、先方にはもうお伝えしてありますので。']],o:['ああ、手回しがいいね。助かるよ。','じゃあ、すぐに伝えておいてくれる？','いつ伝えるつもりなの？'],
tr:'여: 부장님, 그 건은 상대측에 이미 전달해 두었습니다.\n1) 아, 준비성이 좋네. 고마워.\n2) 그럼 바로 전해 줄래?\n3) 언제 전할 생각이야?',e:'「～てあります」= 이미 해 둔 상태. 미리 처리한 것을 칭찬하는 「手回しがいい(준비가 빠르다)」가 자연스럽다.'},
{s:1,k:'sokuji',lines:[['M','鈴木さん、この書類、今日中にってわけじゃないから。']],o:['そうですか。では、明日までに仕上げます。','えっ、今日中に終わらせなきゃいけないんですか。','じゃあ、今すぐ提出します。'],
tr:'남: 스즈키 씨, 이 서류는 오늘 중으로 해야 하는 건 아니니까.\n1) 그래요? 그럼 내일까지 마무리하겠습니다.\n2) 네? 오늘 중으로 끝내야 해요?\n3) 그럼 지금 바로 제출하겠습니다.',e:'「～ってわけじゃない」= ~라는 것은 아니다 → 급하지 않다는 뜻.'},
{s:1,k:'sokuji',lines:[['F','せっかく来ていただいたのに、何のおかまいもできませんで。']],o:['いえいえ、すっかりごちそうになりました。','じゃあ、次はちゃんとかまってくださいね。','本当に、何もなくて残念でした。'],
tr:'여: 모처럼 와 주셨는데 아무 대접도 못 해 드려서.\n1) 아니에요, 잘 대접받았습니다.\n2) 그럼 다음엔 제대로 신경 써 주세요.\n3) 정말 아무것도 없어서 아쉬웠어요.',e:'「何のおかまいもできませんで」는 손님을 보낼 때의 겸손한 인사. 감사로 받는 것이 정답.'},
{s:1,k:'sokuji',lines:[['M','あの店、評判ほどじゃなかったね。']],o:['うん、期待していた分、がっかりしたね。','そうだね、評判以上においしかったね。','じゃあ、もっと評判になるといいね。'],
tr:'남: 그 가게, 평판만큼은 아니었네.\n1) 응, 기대했던 만큼 실망했어.\n2) 그러게, 평판 이상으로 맛있었어.\n3) 그럼 더 유명해지면 좋겠네.',e:'「NほどじゃないN」= ~만큼은 아니다 → 기대 이하.'},

{s:2,k:'kadai',intro:'市役所で男の人と係の人が話しています。男の人はこのあと何をしますか。',q:'男の人はこのあと何をしますか。',
lines:[['M','すみません、引っ越してきたので、住民票の手続きをしたいんですが。'],['F','はい、転入届ですね。前の住所の市役所で発行された転出証明書はお持ちですか。'],['M','はい、これです。'],['F','ありがとうございます。それから、ご本人様確認のため、身分証明書をお願いします。'],['M','運転免許証でいいですか。'],['F','はい、結構です。……あ、お客様、こちらの申請書の、ここ、世帯主のお名前が空欄になっていますね。'],['M','あ、すみません。自分が世帯主です。'],['F','では、こちらにお名前をご記入ください。そのあと、三番の窓口で番号札をお取りになってお待ちください。'],['M','わかりました。']],
o:['申請書に世帯主の名前を書く','転出証明書をもらいに行く','三番の窓口で番号札を取る','運転免許証の住所を変更する'],
tr:'(시청에서 남자와 담당자가 이야기하고 있습니다. 남자는 이후 무엇을 합니까?)\n남: 실례합니다, 이사 와서 주민표 수속을 하고 싶은데요.\n여: 네, 전입 신고시군요. 이전 주소의 시청에서 발급받은 전출 증명서는 가지고 계십니까?\n남: 네, 여기요.\n여: 감사합니다. 그리고 본인 확인을 위해 신분증을 부탁드립니다.\n남: 운전면허증이면 될까요?\n여: 네, 괜찮습니다. ……아, 고객님, 이 신청서의 여기, 세대주 이름이 빈칸으로 되어 있네요.\n남: 아, 죄송합니다. 제가 세대주입니다.\n여: 그럼 여기에 이름을 기입해 주세요. 그 후 3번 창구에서 번호표를 뽑고 기다려 주세요.\n남: 알겠습니다.',
e:'「そのあと」三番の窓口 → 먼저 할 일은 세대주 이름 기입.'},

{s:2,k:'kadai',intro:'会社で女の人と男の人が新商品の発表会について話しています。女の人はこのあと何をしますか。',q:'女の人はこのあと何をしますか。',
lines:[['M','山本さん、発表会の準備、どこまで進んでる？'],['F','会場は押さえました。招待状も昨日発送しました。'],['M','そう。プレゼンの資料は？'],['F','下書きはできています。課長に一度見ていただいてから仕上げようと思っていたんですが。'],['M','課長、今週は出張でいないよ。来週戻ってからだと、ちょっと間に合わないね。じゃあ、資料は僕が先に目を通すよ。メールで送っておいて。'],['F','はい。あ、でも、試作品の写真がまだ一枚入っていないんです。'],['M','それは後で差し替えればいいから、とにかく今の状態で送って。'],['F','わかりました。']],
o:['今の状態の資料を男の人にメールで送る','試作品の写真を撮って資料に入れる','出張中の課長に資料を送る','招待状を発送する'],
tr:'(회사에서 여자와 남자가 신상품 발표회에 대해 이야기하고 있습니다. 여자는 이후 무엇을 합니까?)\n남: 야마모토 씨, 발표회 준비는 어디까지 진행됐어?\n여: 장소는 잡아 두었습니다. 초대장도 어제 발송했습니다.\n남: 그래. 프레젠테이션 자료는?\n여: 초안은 되어 있습니다. 과장님께 한번 봐 주시고 나서 마무리하려고 했는데요.\n남: 과장님 이번 주는 출장이라 안 계셔. 다음 주에 돌아오시고 나서면 좀 늦겠네. 그럼 자료는 내가 먼저 훑어볼게. 메일로 보내 둬.\n여: 네. 아, 그런데 시제품 사진이 아직 한 장 안 들어갔어요.\n남: 그건 나중에 바꾸면 되니까 일단 지금 상태로 보내.\n여: 알겠습니다.',
e:'「とにかく今の状態で送って」. 사진은 나중에, 초대장은 이미 발송.'},

{s:2,k:'point',intro:'男の人と女の人が映画について話しています。女の人はこの映画のどこが一番よかったと言っていますか。',q:'女の人はこの映画のどこが一番よかったと言っていますか。',
lines:[['M','昨日の映画、どうだった？主演の俳優、人気あるよね。'],['F','うん、演技は上手だったよ。でも、それより音楽がすばらしくて。'],['M','へえ、音楽？'],['F','うん、セリフがほとんどない場面でも、音楽だけで登場人物の気持ちが伝わってくるの。映像もきれいだったけど、あの音楽がなかったら、あそこまで感動しなかったと思う。'],['M','ストーリーはどうだったの？'],['F','正直、ありがちな話だったかな。']],
o:['音楽','俳優の演技','映像の美しさ','ストーリー'],
tr:'(남자와 여자가 영화에 대해 이야기하고 있습니다. 여자는 이 영화의 어디가 가장 좋았다고 말하고 있습니까?)\n남: 어제 영화 어땠어? 주연 배우 인기 많잖아.\n여: 응, 연기는 잘했어. 그런데 그보다 음악이 훌륭했어.\n남: 오, 음악?\n여: 응, 대사가 거의 없는 장면에서도 음악만으로 등장인물의 마음이 전해져 와. 영상도 예뻤지만 그 음악이 없었으면 그렇게까지 감동하지 않았을 거야.\n남: 스토리는 어땠어?\n여: 솔직히 흔한 이야기였던 것 같아.',
e:'「それより」「あの音楽がなかったら…感動しなかった」 → 음악.'},

{s:2,k:'point',intro:'女の人と男の人が話しています。男の人はどうして会議に遅れましたか。',q:'男の人はどうして会議に遅れましたか。',
lines:[['F','遅かったですね。電車、遅れてたんですか。'],['M','いや、電車は時間通りだったんだけど、駅を出たところで、道に迷っているおばあさんがいてね。'],['F','ああ、案内してあげたんですか。'],['M','うん。近くだと思ったら、けっこう遠くて。それに、途中で会社に電話しようと思ったら、携帯の電池が切れちゃってて。'],['F','そうだったんですか。']],
o:['道に迷った人を目的地まで案内したから','電車が遅れたから','自分が道に迷ったから','携帯の電池を買いに行ったから'],
tr:'(여자와 남자가 이야기하고 있습니다. 남자는 왜 회의에 늦었습니까?)\n여: 늦으셨네요. 전철이 늦었어요?\n남: 아니, 전철은 제시간이었는데, 역을 나온 곳에서 길을 잃은 할머니가 계셔서.\n여: 아, 안내해 드렸군요.\n남: 응. 가까운 줄 알았더니 꽤 멀어서. 게다가 도중에 회사에 전화하려고 했더니 휴대폰 배터리가 다 나가 버려서.\n여: 그랬군요.',
e:'전철은 정시. 지각 원인 = 길 잃은 할머니 안내. 배터리는 연락 못 한 이유.'},

{s:2,k:'gaiyo',intro:'講演会で女の人が話しています。',q:'女の人の話のテーマは何ですか。',
lines:[['F','皆さんは、一日にどのくらい「座って」いますか。デスクワークの多い現代人は、一日の大半を座って過ごしていると言われます。長時間座り続けると血流が悪くなり、さまざまな病気のリスクが高まることが、多くの研究で指摘されています。とはいえ、仕事中にジムへ行くわけにもいきません。大切なのは、こまめに立ち上がることです。三十分に一度、席を立って少し歩くだけでも効果があるそうです。電話をするときは立って話す、エレベーターではなく階段を使うといった、小さな工夫から始めてみてはいかがでしょうか。']],
o:['長時間座ることの害と、日常でできる対策','デスクワークの効率を上げる方法','ジムでの効果的な運動の方法','現代人がかかりやすい病気の種類'],
tr:'(강연회에서 여자가 이야기하고 있습니다.)\n여: 여러분은 하루에 얼마나 \'앉아\' 계십니까? 사무직이 많은 현대인은 하루의 대부분을 앉아서 보낸다고 합니다. 오랜 시간 계속 앉아 있으면 혈류가 나빠지고 여러 질병의 위험이 높아진다는 것이 많은 연구에서 지적되고 있습니다. 그렇다고 해서 업무 중에 헬스장에 갈 수도 없습니다. 중요한 것은 자주 일어서는 것입니다. 30분에 한 번 자리에서 일어나 조금 걷는 것만으로도 효과가 있다고 합니다. 전화할 때는 서서 이야기하기, 엘리베이터 대신 계단 이용하기 같은 작은 노력부터 시작해 보는 것은 어떨까요?\n(질문: 여자 이야기의 주제는 무엇입니까?)',
e:'문제 제기(오래 앉기의 해로움) → 해결책(자주 일어서기, 작은 노력). 헬스장은 \'갈 수 없다\'로 부정.'},

READ.push(
{s:1,k:'文章の文法',lang:true,title:'手書きの手紙',text:'最近、手書きの手紙をもらう機会がめっきり減った。用件を伝えるだけなら、メールのほうがはるかに便利である。（１）、先日、恩師から届いた一枚の葉書には、メールでは決して味わえない温かさがあった。\n少し右上がりの文字、ところどころに残る書き直しの跡。そこには、書いた人の姿が（２）浮かんでくる。忙しい中、わざわざペンを取ってくれたのだと思うと、胸が熱くなった。\n手紙の価値は、内容だけにあるのではない。書くのにかかった時間や手間（３）、相手への思いを伝えているのではないだろうか。便利さを追い求める時代だからこそ、私も年に一度くらいは、大切な人に手紙を書いて（４）。',
tr:'최근 손으로 쓴 편지를 받을 기회가 눈에 띄게 줄었다. 용건을 전하기만 한다면 메일이 훨씬 편리하다. (1)그러나 얼마 전 은사님께 받은 엽서 한 장에는 메일로는 결코 맛볼 수 없는 따뜻함이 있었다.\n살짝 오른쪽 위로 올라간 글씨, 군데군데 남은 고쳐 쓴 흔적. 거기에는 쓴 사람의 모습이 (2)생생하게 떠오른다. 바쁜 와중에 일부러 펜을 들어 주셨다고 생각하니 가슴이 뭉클해졌다.\n편지의 가치는 내용에만 있는 것이 아니다. 쓰는 데 든 시간과 수고 (3)그 자체가 상대에 대한 마음을 전하고 있는 것이 아닐까. 편리함을 좇는 시대이기에 더욱, 나도 1년에 한 번 정도는 소중한 사람에게 편지를 써 (4)보려고 한다.',
qs:[{q:'（１）に入るものはどれか。',o:['しかし','そのうえ','つまり','したがって'],e:'앞: 메일이 편리하다 ↔ 뒤: 엽서에는 메일에 없는 따뜻함 → 역접 しかし.'},
{q:'（２）に入るものはどれか。',o:['ありありと','うっすらと','さっぱりと','こっそりと'],e:'ありありと = 생생하게, 눈앞에 보이듯. 뒤의 「胸が熱くなった」와 이어진다.'},
{q:'（３）に入るものはどれか。',o:['そのものが','ばかりか','にとって','にしては'],e:'「時間や手間そのものが…伝えている」 = 시간과 수고 그 자체가 전하고 있다.'},
{q:'（４）に入るものはどれか。',o:['みようと思う','みたものだ','みるところだった','みるまでもない'],e:'필자의 앞으로의 결심 → 「～てみようと思う」.'}]},
{s:1,k:'情報検索',title:'市民文化講座のお知らせ',text:'〇〇市　市民文化講座（1月～3月）\n①初めての書道　毎週火曜 10:00～12:00　受講料6,000円（全10回）　対象：どなたでも　※道具の貸し出しあり\n②スマホ活用術　毎週木曜 14:00～15:30　受講料3,000円（全6回）　対象：60歳以上\n③英会話（初級）　毎週土曜 10:00～11:30　受講料8,000円（全10回）　対象：高校生以上\n④親子料理教室　第2・第4日曜 10:00～13:00　受講料1回1,500円（材料費込み）　対象：小学生とその保護者\n申込方法：12月15日までに、市役所窓口または市のホームページから。応募者多数の場合は抽選。市外在住の方は、受講料が2割増しになります。',
tr:'○○시 시민 문화 강좌(1월~3월)\n① 처음 하는 서예: 매주 화요일 10:00~12:00, 수강료 6,000엔(총 10회), 대상: 누구나, ※도구 대여 있음\n② 스마트폰 활용법: 매주 목요일 14:00~15:30, 수강료 3,000엔(총 6회), 대상: 60세 이상\n③ 영어 회화(초급): 매주 토요일 10:00~11:30, 수강료 8,000엔(총 10회), 대상: 고등학생 이상\n④ 부모와 자녀 요리 교실: 둘째·넷째 일요일 10:00~13:00, 수강료 1회 1,500엔(재료비 포함), 대상: 초등학생과 보호자\n신청 방법: 12월 15일까지 시청 창구 또는 시 홈페이지에서. 신청자가 많으면 추첨. 시외 거주자는 수강료가 20% 할증됩니다.',

{s:2,k:'文章の文法',lang:true,title:'失敗とのつきあい方',text:'子供のころ、私は失敗をひどく恐れていた。テストで悪い点を取ること、人前で間違えること、（１）が恥ずかしくてたまらなかった。\nところが、社会に出てみると、失敗しない人などどこにもいないことに気づいた。（２）、優れた仕事をしている人ほど、数多くの失敗を経験している。彼らは失敗を隠すのではなく、そこから何を学ぶか（３）考えているのだ。\n失敗は避けるべきものではなく、成長のための材料なのかもしれない。そう考えるようになってから、私は新しいことに挑戦するのが（４）。',
tr:'어렸을 때 나는 실패를 몹시 두려워했다. 시험에서 나쁜 점수를 받는 것, 사람들 앞에서 틀리는 것, (1)그 모든 것이 창피해서 견딜 수 없었다.\n그런데 사회에 나와 보니 실패하지 않는 사람 따위는 어디에도 없다는 것을 깨달았다. (2)오히려 훌륭한 일을 하는 사람일수록 수많은 실패를 경험하고 있다. 그들은 실패를 숨기는 것이 아니라 거기서 무엇을 배울지 (3)만을 생각하고 있는 것이다.\n실패는 피해야 할 것이 아니라 성장을 위한 재료인지도 모른다. 그렇게 생각하게 된 후로 나는 새로운 일에 도전하는 것이 (4)두렵지 않게 되었다.',
qs:[{q:'（１）に入るものはどれか。',o:['そのすべて','そのたびに','それだけ','それなのに'],e:'앞에 나열한 것들을 묶는 말 → そのすべて(그 모든 것).'},
{q:'（２）に入るものはどれか。',o:['むしろ','ところで','それとも','なぜなら'],e:'「실패 안 하는 사람은 없다」에서 한 걸음 더 → むしろ(오히려 ~일수록).'},
{q:'（３）に入るものはどれか。',o:['ばかり','までも','さえも','だけに'],e:'「何を学ぶかばかり考えている」 = 무엇을 배울지만 생각한다.'},
{q:'（４）に入るものはどれか。',o:['怖くなくなった','怖くなるところだった','怖いに違いない','怖くてならない'],e:'생각이 바뀐 뒤의 변화 → 「怖くなくなった」(두렵지 않게 되었다).'}]},
{s:2,k:'情報検索',title:'アルバイト募集',text:'カフェ・ミモザ　アルバイト募集\n【A】ホール　平日 7:00～11:00　時給1,150円　週3日以上\n【B】ホール　土日祝 10:00～18:00　時給1,250円　週1日以上\n【C】キッチン　平日 17:00～22:00　時給1,300円　週2日以上　※調理経験者優遇\n【D】キッチン　毎日 22:00～翌2:00　時給1,500円　週2日以上　※18歳以上\n・交通費は1日500円まで支給します。\n・応募方法：店頭の応募用紙に記入するか、お電話で面接日をご予約ください。\n・高校生は応募できません。',

tr:'(회사에서 세 사람이 신입 사원 환영회 가게에 대해 이야기하고 있습니다.)\n여: 환영회 가게는 어디로 할까요? 역 앞 이탈리안, 고깃집, 그리고 일식집 세 군데로 좁혔는데요.\n남1: 고기는 다들 좋아하지만, 신입 중에 고기를 못 먹는 사람이 있다고 들었어.\n여: 아, 그래요? 그럼 고깃집은 빼죠.\n남2: 이탈리안은 요리도 세련됐고 괜찮지 않아?\n남1: 그런데 거기는 스무 명 들어가는 방이 없어. 이번엔 다 해서 스물두 명이니까.\n여: 일식집이라면 개별실이 있어서 서른 명까지 괜찮아요. 예산이 조금 넘긴 하지만요.\n남2: 조금 정도면 회사에서 보조가 나오니까 문제없어.\n남1: 그럼 결정됐네.\n(질문: 환영회는 어느 가게에서 하기로 했습니까?)',

lines:[['N','市民センターでは、来月から三つの料理教室を開きます。一つ目は「和食の基本」。だしの取り方から学べます。二つ目は「十五分でできる晩ごはん」。お忙しい方向けに、手早く作れる料理をご紹介します。三つ目は「パン作り入門」。週末の午前中に開催します。','ラジオ'],['M','料理教室か。君、行ってみたら？','男'],['F','そうねえ。パン作りは前からやってみたかったんだけど、週末は子供の習い事の送り迎えがあるし…。','女'],['M','じゃあ、平日の教室だね。和食は？','男'],['F','和食は母に習ってるから大丈夫。それより、仕事から帰ってすぐ作れるものを覚えたいな。','女'],['M','じゃあ、それで決まりだね。','男']],
o:['十五分でできる晩ごはん','和食の基本','パン作り入門','どれにも参加しない'],
tr:'(라디오에서 요리 교실 안내를 듣고 부부가 이야기하고 있습니다.)\n라디오: 시민 센터에서는 다음 달부터 세 가지 요리 교실을 엽니다. 첫 번째는 \'일식의 기본\'. 국물 내는 법부터 배울 수 있습니다. 두 번째는 \'15분 만에 만드는 저녁밥\'. 바쁘신 분들을 위해 빨리 만들 수 있는 요리를 소개합니다. 세 번째는 \'빵 만들기 입문\'. 주말 오전에 열립니다.\n남: 요리 교실이라. 당신 가 보지 그래?\n여: 글쎄. 빵 만들기는 전부터 해 보고 싶었는데, 주말엔 아이 학원 데려다주고 데려와야 해서….\n남: 그럼 평일 교실이네. 일식은?\n여: 일식은 엄마한테 배우고 있으니까 괜찮아. 그보다 퇴근하고 바로 만들 수 있는 걸 배우고 싶어.\n남: 그럼 그걸로 결정이네.\n(질문: 여자는 어느 교실에 참가합니까?)',
e:'빵: 주말이라 불가. 일식: 이미 어머니께 배우는 중. 「仕事から帰ってすぐ作れるもの」 → 15분 저녁밥.'}
);


</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=$('#view');
const store={get(k,d){try{const v=localStorage.getItem('n1_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('n1_'+k,JSON.stringify(v))}catch(e){}}};
const S={known:store.get('known',{}),gram:store.get('gram',{}),done:store.get('done',{}),wrong:store.get('wrong',{}),hist:store.get('hist',[]),srs:store.get('srs',{}),exam:store.get('exam','2026-12-06'),rate:store.get('rate',0.95)};
const save=()=>{for(const k in S)store.set(k,S[k])};

const CORE=VOCAB_RAW.trim().split('\n').map(l=>{const [w,r,m,ej,ek]=l.split('|');return{w,r,m,ej,ek}});
const VOCAB=[];{const cnt={};const byW={};
(typeof BIGV!=='undefined'?BIGV:[]).forEach(x=>{const lv=x[5];cnt[lv]=(cnt[lv]||0)+1;const v={id:'n'+lv+'-'+cnt[lv],w:x[0],r:x[1],m:x[2],ej:x[3],ek:x[4],lv,en:!!x[6],core:false};VOCAB.push(v);if(!byW[v.w])byW[v.w]=v});
CORE.forEach((c,i)=>{const v=byW[c.w];if(v){v.core=true;if(!v.ej){v.ej=c.ej;v.ek=c.ek}if(v.en){v.m=c.m;v.en=false}}else VOCAB.push({id:'c-'+i,...c,lv:1,en:false,core:true})});}
const VBY={};VOCAB.forEach(v=>VBY[v.id]=v);
const GRAM=[...GRAM_RAW.trim().split('\n').map((l,i)=>{const [p,m,c,ej,ek]=l.split('|');return{id:'g'+i,p,m,c,ej,ek,lv:1}}),...(typeof GRAM_RAW2!=='undefined'?GRAM_RAW2.trim().split('\n').map((l,i)=>{const [p,m,c,ej,ek,lv]=l.split('|');return{id:'h'+i,p,m,c,ej,ek,lv:+lv||1}}):[])];
const gPool=()=>GRAM.filter(g=>st.gLv==='all'||String(g.lv)===st.gLv);
const TYPE={kanji:'問題1 漢字読み',bunmyaku:'問題2 文脈規定',iikae:'問題3 言い換え類義',yoho:'問題4 用法',bunpo:'問題5 文法形式の判断',narabe:'問題6 文の組み立て'};
const TYPEKO={kanji:'한자 읽기',bunmyaku:'문맥 규정',iikae:'유의어 바꿔 말하기',yoho:'용법',bunpo:'문법 형식 판단',narabe:'문장 만들기(★)'};
const LTYPE={kadai:'課題理解',point:'ポイント理解',gaiyo:'概要理解',sokuji:'即時応答',togo:'統合理解'};

function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuf(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const mkOpts=(id,o)=>shuf(o.map((t,i)=>({t,ok:i===0})),seeded(id));

// ---- question registry
const Q={};const ORDER=[];
const cnt={};
BANK.forEach(b=>{const k=b.t+b.s;cnt[k]=(cnt[k]||0)+1;const id=b.t+b.s+'-'+cnt[k];Q[id]={id,sec:'lang',set:b.s,type:b.t,label:TYPE[b.t],body:b.t==='yoho'?`<div class="hint">次の言葉の使い方として最もよいものを選びなさい。</div><div class="word">${b.q}</div>`:b.q,opts:mkOpts(id,b.o),e:b.e,tr:b.tr};ORDER.push(id)});
READ.forEach((p,n)=>{p.id='r'+n;p.qids=p.qs.map((x,j)=>{const id='r'+n+'-'+j;Q[id]={id,sec:p.lang?'lang':'read',set:p.s,label:p.k,body:x.q,opts:mkOpts(id,x.o),e:x.e,ctx:n};return id})});
LISTEN.forEach((L,n)=>{const id='l'+n;L.id=id;Q[id]={id,sec:'listen',set:L.s,label:'聴解 '+LTYPE[L.k],L,body:L.k==='sokuji'?'まず文を聞いてください。それから、その返事を聞いて、1から3の中から、最もよいものを一つ選んでください。':((L.k==='gaiyo'||L.k==='togo')?'話を聞いて、質問と選択肢を聞き、最もよいものを一つ選んでください。':L.q),opts:mkOpts(id,L.o),e:L.e}});

// ---- speech (Android 앱: AndroidTTS 네이티브, 브라우저: speechSynthesis)
const AT=window.AndroidTTS||null;
let VO=[];
const loadV=()=>{if(AT)return;try{VO=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang))}catch(e){VO=[]}};
const hasTTS=!!AT||('speechSynthesis' in window);
if(!AT&&'speechSynthesis' in window){loadV();try{speechSynthesis.addEventListener('voiceschanged',loadV)}catch(e){}}
function voiceFor(sp){
  if(!VO.length)return{v:null,p:sp==='M'?0.7:sp==='F'?1.2:1};
  const male=VO.find(v=>/\bmale\b|男|otoya|ichiro|keita|daichi|naoki|hattori|jac|jad/i.test(v.name));
  const fem=VO.find(v=>v!==male&&/female|女|kyoko|haruka|ayumi|nanami|o-ren|sayaka|mizuki|jab|htm/i.test(v.name))||VO.find(v=>v!==male)||VO[0];
  if(sp==='M')return male?{v:male,p:1}:{v:fem,p:0.62};
  if(sp==='F')return{v:fem,p:1.12};
  return{v:VO.find(v=>v!==male&&v!==fem)||fem,p:0.95};
}
let tok=0,onStop=null;const pend={};
window.__ttsDone=id=>{const f=pend[id];if(f){delete pend[id];f()}};
function stopAll(){tok++;for(const k in pend)delete pend[k];try{AT?AT.stop():speechSynthesis.cancel()}catch(e){}if(onStop){const f=onStop;onStop=null;f()}}
function play(parts,done){
  if(!hasTTS)return;stopAll();const my=++tok;let k=0;onStop=done||null;
  const next=()=>{if(my!==tok)return;if(k>=parts.length){onStop=null;done&&done();return}
    const [sp,t,pause]=parts[k++];const after=()=>setTimeout(next,pause??500);
    if(AT){const id='u'+my+'_'+k;pend[id]=after;try{AT.speakJa(t,sp,S.rate,id)}catch(e){delete pend[id];next()}return}
    const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';const vv=voiceFor(sp);if(vv.v)u.voice=vv.v;u.pitch=vv.p;u.rate=S.rate;
    u.onend=after;u.onerror=()=>setTimeout(next,80);try{speechSynthesis.speak(u)}catch(e){next()}};
  next();
}
const say=t=>play([['F',t,0]]);
function lParts(q){const L=q.L,p=[];const other=s=>s==='M'?'F':'M';
  if(L.k==='sokuji'){L.lines.forEach(l=>p.push([l[0],l[1],900]));q.opts.forEach((o,i)=>{p.push(['N',(i+1)+'。',250]);p.push([other(L.lines[0][0]),o.t,700])});return p}
  p.push(['N',L.intro,900]);L.lines.forEach(l=>p.push([l[0],l[1],600]));p.push(['N',L.q,900]);
  if(L.k==='gaiyo'||L.k==='togo')q.opts.forEach((o,i)=>{p.push(['N',(i+1)+'。'+o.t,600])});return p}

// ---- question card
function card(q,mode,ch){ // mode: practice | mock | review
  const reveal=mode==='review'||(mode==='practice'&&ch!=null);
  const audioOnly=q.sec==='listen'&&(q.L.k==='sokuji'||q.L.k==='gaiyo'||q.L.k==='togo')&&!reveal;
  const ops=q.opts.map((o,i)=>{let c='';if(reveal){if(o.ok)c='ok';else if(i===ch)c='bad'}else if(i===ch)c='sel';
    return`<button class="opt ${c}" data-q="${q.id}" data-i="${i}" ${reveal?'disabled':''}><span class="bub">${i+1}</span><span>${audioOnly?'<span class="hint">음성으로 들려주는 선택지 '+(i+1)+'</span>':o.t}</span></button>`}).join('');
  let extra='';
  if(q.sec==='listen')extra=player(q,mode)+(reveal?script(q.L):'');
  let exp='';
  if(reveal){const ci=q.opts.findIndex(o=>o.ok);const right=ch===ci;
    exp=`<div class="exp">${mode==='review'&&ch==null?'<span class="mark">無答</span>':`<span class="mark ${right?'o':''}">${right?'正解':'不正解'}</span>`}정답 <b>${ci+1}</b> · ${q.e}${q.tr?`<p class="tr">해석: ${q.tr}</p>`:''}</div>`}
  return`<section class="q" id="c-${q.id}" data-mode="${mode}"><div class="lab"><b>${q.label}</b>${q.sec==='lang'&&q.type?' · '+TYPEKO[q.type]:''}</div>${extra}<div class="body jp">${q.body}</div><div class="opts">${ops}</div>${exp}</section>`}
function player(q,mode){const locked=mode==='mock'&&M.played[q.id];
  return`<div class="player" id="p-${q.id}"><button class="btn ai" data-play="${q.id}" ${locked?'disabled':''}>${locked?'재생 완료':'▶ 듣기'}</button><button class="btn" data-stop>■ 정지</button><div class="wave">${'<i></i>'.repeat(14)}</div>${mode==='mock'?'<span class="hint">실전처럼 1회만 재생</span>':''}</div>`}
function script(L){return`<details class="script" open><summary>스크립트 · 해석</summary>${L.intro?`<p><b>問</b>${L.intro}</p>`:''}${L.lines.map(l=>`<p><b>${l[2]||(l[0]==='M'?'男':l[0]==='F'?'女':'')}</b>${l[1]}</p>`).join('')}<div class="trans">${L.tr}</div></details>`}

// ---- state
const P={};// practice answers (session)
let route='home';
const st={vSub:'card',vi:0,vFilter:'all',vLv:'1',vOrder:null,kLv:'1',kq:'',kShow:60,vShow:200,vFlip:false,vQuiz:null,gSub:'list',gq:'',gLv:'all',gQuiz:null,typeSel:'kanji',rOpen:null,lOpen:null,showTr:false,wrongOnly:false};
let M={phase:'pick'};

function setRoute(){const h=(location.hash||'#home').slice(1);route=['home','vocab','grammar','reading','listening','mock','wrong'].includes(h)?h:'home';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===route||(route==='wrong'&&a.dataset.v==='home')));stopAll();render();scrollTo(0,0)}

function render(){view.innerHTML=({home,vocab,grammar,reading,listening,mock,wrong})[route]()}

// ---- HOME
function daysLeft(){const d=new Date(S.exam+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function home(){
  const dl=daysLeft();const kn=Object.keys(S.known).length,k12=VOCAB.filter(v=>v.lv<=2&&S.known[v.id]).length,n12=VOCAB.filter(v=>v.lv<=2).length,gr=Object.keys(S.gram).length;
  const rd=READ.filter(p=>S.done[p.id]).length,ls=LISTEN.filter(l=>S.done[l.id]).length,ty=ORDER.filter(id=>S.done[id]).length;
  const wr=Object.keys(S.wrong).filter(id=>Q[id]).length;const last=S.hist[S.hist.length-1];
  const days=Math.max(dl,1);const per=(n)=>Math.ceil(Math.max(n,0)/days);
  const pc=(a,b)=>b?Math.round(a/b*100):0;
  const tile=(h,t,a,b)=>`<a href="#${h}"><b>${t}</b><span>${a} / ${b}</span><div class="bar"><i style="width:${pc(a,b)}%"></i></div></a>`;
  return`<div class="hero"><div class="hint">JLPT N1 시험까지</div>
  <div class="dday">${dl>0?'D-'+dl:dl===0?'D-Day':'D+'+(-dl)}</div>
  <div class="row"><span class="hint">시험일</span><input type="date" id="exam" value="${S.exam}" aria-label="시험일"></div></div>
  <div class="menu">${tile('vocab','단어',kn,VOCAB.length)}${tile('grammar','문법',gr,GRAM.length)}${tile('reading','독해',rd,READ.length)}${tile('listening','듣기',ls,LISTEN.length)}
  <a href="#wrong"><b>오답노트</b><span>${wr}문항 복습</span></a>
  <a href="#mock"><b>모의고사</b><span>${last?'최근 '+last.total+'점':'2회분 풀기'}</span></a></div>
  <h3>오늘 할 공부</h3>
  ${dl<0?'<p class="empty">시험일이 지났어요. 위에서 다음 시험일을 설정하세요.</p>':`<ul class="plan">
  <li><b>${per(n12-k12)}</b><span>단어 외우기 (N1·N2)</span></li>
  ${dueList().length?`<li><b>${dueList().length}</b><span>복습할 단어</span></li>`:''}
  <li><b>${per(GRAM.length-gr)}</b><span>문법 확인</span></li>
  <li><b>${per(ORDER.length-ty)}</b><span>기출유형 문제</span></li>
  <li><b>${per(READ.length-rd)}</b><span>독해 지문</span></li>
  <li><b>${per(LISTEN.length-ls)}</b><span>듣기 문제</span></li>
  ${dl<=7?`<li><b>1</b><span>모의고사 1회 + 오답 복습</span></li>`:''}</ul>`}
  <details class="box"><summary>N1 시험 구성 · 합격 기준</summary>
  <table><tbody>
  <tr><td>1교시 (110분)</td><td>문자·어휘·문법 + 독해</td></tr>
  <tr><td>2교시 (55분)</td><td>청해(듣기)</td></tr>
  <tr><td>합격 기준</td><td>180점 만점에 100점 이상, 과목별(언어지식·독해·청해 각 60점) 19점 이상</td></tr></tbody></table>
  <p class="hint">2026년 제2회 시험은 12월 6일(일). 앱의 문제는 실제 시험 형식에 맞춰 새로 만든 연습 문제이고, 모의고사 점수는 정답률로 환산한 추정치예요.</p></details>
  <details class="box"><summary>설정</summary>
  <div class="row" style="margin-bottom:10px"><label for="rate">듣기 속도</label><select id="rate">${[0.8,0.9,0.95,1,1.1].map(r=>`<option value="${r}" ${S.rate==r?'selected':''}>${r}배</option>`).join('')}</select>
  <button class="btn ai" data-say="本日はよろしくお願いいたします。">음성 테스트</button></div>
  ${hasTTS?'':'<p class="warn">음성 기능을 쓸 수 없어요. 듣기는 스크립트로만 볼 수 있어요.</p>'}
  <p class="hint" id="vinfo"></p>
  <button class="btn" data-reset style="margin-bottom:12px">학습 기록 초기화</button><div id="resetbox"></div></details>`}

// ---- VOCAB
const LVNAME={'1':'N1','2':'N2','3':'N3','4':'N4','5':'N5','all':'전체','core':'핵심 159'};
function lvList(){const L=st.vLv;return VOCAB.filter(v=>L==='all'||(L==='core'?v.core:String(v.lv)===L))}
function lvCount(L){return VOCAB.filter(v=>L==='all'||(L==='core'?v.core:String(v.lv)===L)).length}
const DAY=864e5,IV=[0,1,3,7,14,30,60];
function dueList(){const now=Date.now();return Object.keys(S.srs).filter(id=>VBY[id]&&S.srs[id][1]<=now)}
function mark(id,ok){const c=S.srs[id]||[0,0];if(ok){const b=Math.min(c[0]+1,IV.length-1);S.srs[id]=[b,Date.now()+IV[b]*DAY];S.known[id]=1}else{S.srs[id]=[0,Date.now()+10*60000];delete S.known[id]}save()}
function vocab(){const s=st.vSub;const due=dueList().length;
  return`<h2>단어 <span class="jp" style="font-size:.6em;color:var(--mute)">文字・語彙</span></h2><p class="sub">N5~N1 누적 ${VOCAB.length.toLocaleString()}개 · 급수별 학습 · 외운 단어는 1·3·7·14·30일 간격으로 다시 나와요</p>
  <div class="seg">${[['card','암기 카드'],['review','복습 '+due],['quiz','퀴즈'],['kanji','한자'],['all','목록·검색'],['type','기출유형']].map(([k,l])=>`<button data-vsub="${k}" class="${s===k?'on':''}">${l}</button>`).join('')}</div>
  ${s==='card'?vCard():s==='review'?vReview():s==='quiz'?quizView('v'):s==='kanji'?kanjiView():s==='type'?typeView(['kanji','bunmyaku','iikae','yoho']):vList()}`}
function lvSelect(){return`<select id="vlv" aria-label="급수">${['1','2','3','4','5','core','all'].map(k=>`<option value="${k}" ${st.vLv===k?'selected':''}>${LVNAME[k]} (${lvCount(k).toLocaleString()})</option>`).join('')}</select>`}
function vPool(){if(!st.vOrder)st.vOrder=lvList().map(v=>v.id);return st.vOrder.filter(id=>st.vFilter==='all'||!S.known[id])}
function vFace(v,extra){return`<div class="w jp">${v.w}</div>${v.r?`<div class="r jp">${v.r}</div>`:''}<div class="m">${v.m}${v.en?' <span class="chip">영어 뜻</span>':''}</div>${v.ej?`<div class="ex"><p class="jp">${v.ej}</p><p class="hint">${v.ek}</p></div>`:''}${extra||''}`}
function vCard(){const pool=vPool();if(!pool.length)return`${vFilterRow()}<p class="empty">이 급수는 다 외웠어요! '전체 카드'로 바꾸면 다시 볼 수 있어요.</p>`;
  if(st.vi>=pool.length)st.vi=0;const v=VBY[pool[st.vi]];const kn=!!S.known[v.id];
  return`${vFilterRow()}<div class="card flash" data-vnext tabindex="0" role="button" aria-label="다음 단어">
  <div class="hint">N${v.lv} · ${st.vi+1} / ${pool.length.toLocaleString()}${kn?' · 외움 ✓':''}</div>${vFace(v,'<div class="tapnext">카드를 누르면 다음 단어 · 오른쪽으로 밀면 이전 단어</div>')}</div>
  <div class="row" style="margin-top:10px"><button class="btn" data-vnav="-1" aria-label="이전">←</button>
  <button class="btn ai" data-say="${v.r||v.w}。${v.ej||''}" aria-label="발음 듣기">🔊</button>
  <button class="btn" data-vmark="0" data-id="${v.id}" style="flex:1">모르겠어요</button>
  <button class="btn pri" data-vmark="1" data-id="${v.id}" style="flex:1">외웠어요 ✓</button></div>`}

function vReview(){const due=dueList();if(!due.length)return`<p class="empty">지금 복습할 단어가 없어요. 카드에서 "외웠어요"나 "모르겠어요"를 누른 단어가 정해진 날짜에 여기 나와요.</p>`;

function vList(){return`<div class="row" style="margin-bottom:10px">${lvSelect()}<input id="vsearch" placeholder="단어·읽기·뜻 검색" style="flex:1" value="${esc(st.vq||'')}"></div><table class="stack"><thead><tr><th>단어</th><th>읽기</th><th>뜻</th><th>예문</th></tr></thead><tbody id="vrows">${vRows()}</tbody></table>`}

  return rows.map(v=>`<tr><td class="jp"><b>${v.w}</b> <span class="chip">N${v.lv}</span>${S.known[v.id]?' <span class="chip done">외움</span>':''}</td><td class="jp">${v.r}</td><td>${v.m}</td><td>${v.ej?`<span class="jp">${v.ej}</span><br><span class="hint">${v.ek}</span>`:''}</td></tr>`).join('')+(all.length>rows.length?`<tr><td colspan="4"><button class="btn" data-vmore style="width:100%">더 보기 (${(all.length-rows.length).toLocaleString()}개 남음)</button></td></tr>`:'')||'<tr><td colspan="4" class="empty">결과 없음</td></tr>'}
function kanjiView(){const q=st.kq.trim();const all=KANJI.filter(k=>(st.kLv==='all'||String(k[2])===st.kLv)&&(!q||k[0]===q||k[1].includes(q)||k[3].some(e=>e[0].includes(q))));const list=all.slice(0,st.kShow);

  <div id="krows">${list.map(k=>`<div class="q" style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start"><div style="text-align:center"><div class="jp" style="font-size:44px;font-weight:800;line-height:1.1">${k[0]}</div><div style="color:var(--ai);font-weight:700">${k[1]}</div><span class="chip">N${k[2]}</span></div><div>${k[3].map(e=>`<div class="jp" style="padding:3px 0"><b>${e[0]}</b> <span class="hint">${e[1]}</span> · <span style="font-family:inherit">${e[2]}</span></div>`).join('')}</div></div>`).join('')}
  ${all.length>list.length?`<button class="btn" data-kmore style="width:100%">더 보기 (${all.length-list.length}자 남음)</button>`:''}${all.length?'':'<p class="empty">결과 없음</p>'}</div>`}

// ---- quizzes (vocab/grammar)
function makeQuiz(kind){const items=[];
  if(kind==='v'){const pool=lvList();shuf(pool).slice(0,10).forEach((v,n)=>{const mode=(n%2&&v.r)?'r':'m';const others=shuf(pool.filter(x=>x!==v&&(mode==='m'?x.m!==v.m:(x.r&&x.r!==v.r)))).slice(0,3);
    const id='vq'+Date.now()+n;items.push({id,tmp:true,sec:'quiz',label:mode==='m'?'뜻 고르기':'읽기 고르기',body:`<div class="word">${v.w}</div>`,opts:shuf([v,...others].map((x,i)=>({t:mode==='m'?x.m:x.r,ok:i===0}))),e:`${v.w}${v.r?'('+v.r+')':''} ${v.m}`,tr:v.ej?v.ej+' — '+v.ek:''})})}
  else{const gp=gPool();shuf(gp).slice(0,10).forEach((g,n)=>{const others=shuf(gp.filter(x=>x!==g&&x.m!==g.m)).slice(0,3);const id='gq'+Date.now()+n;
    items.push({id,tmp:true,sec:'quiz',label:'문형 의미 고르기',body:(()=>{const core=g.p.replace(/（.*?）|\(.*?\)|～/g,'');return n%2&&g.ej.includes(core)?`${g.ej.replace(core,'<u>$&</u>')}<div class="hint" style="margin-top:6px">밑줄 친 문형의 의미는?</div>`:`<div class="word">${g.p}</div>`})(),opts:shuf([g,...others].map((x,i)=>({t:x.m,ok:i===0}))),e:`${g.p} = ${g.m} (접속: ${g.c})`,tr:g.ej+' — '+g.ek})})}
  items.forEach(q=>Q[q.id]=q);return items.map(q=>q.id)}
function quizView(kind){const key=kind==='v'?'vQuiz':'gQuiz';if(!st[key])st[key]=makeQuiz(kind);const ids=st[key];
  const done=ids.filter(id=>P[id]!=null).length,right=ids.filter(id=>P[id]!=null&&Q[id].opts[P[id]].ok).length;
  return`<div class="row" style="margin-bottom:10px">${kind==='v'?lvSelect():gLvSel()}</div><div class="row" style="justify-content:space-between"><span class="hint">${done}/10 풀이 · ${right}개 정답</span><button class="btn" data-newquiz="${kind}">새 퀴즈</button></div>${ids.map(id=>card(Q[id],'practice',P[id])).join('')}`}

function typeView(types){if(!types.includes(st.typeSel))st.typeSel=types[0];const t=st.typeSel;

  return`<div class="seg">${types.map(k=>`<button data-type="${k}" class="${k===t?'on':''}">${TYPEKO[k]}</button>`).join('')}</div>

  <div class="seg">${[['list','문형 목록'],['quiz','10문항 퀴즈'],['type','기출유형']].map(([k,l])=>`<button data-gsub="${k}" class="${s===k?'on':''}">${l}</button>`).join('')}</div>

function gList(){return`<div class="row" style="margin-bottom:8px">${gLvSel()}</div><input id="gsearch" placeholder="문형·의미 검색 (예: 하자마자)" style="width:100%;margin-bottom:6px" value="${esc(st.gq)}"><div id="grows">${gRows()}</div>`}
function gRows(){const q=st.gq.trim();return gPool().filter(g=>!q||(g.p+g.m+g.c).includes(q)).map(g=>`<details class="g"><summary><span><span class="p jp">${g.p}</span> <span class="chip">N${g.lv}</span><br><span class="hint">${g.m}</span></span>${S.gram[g.id]?'<span class="chip done">확인</span>':'<span class="chip">미확인</span>'}</summary>

// ---- MOCK
function mockIds(set){return{lang:[...ORDER.filter(id=>Q[id].set===set),...READ.filter(p=>p.s===set&&p.lang).flatMap(p=>p.qids)],read:READ.filter(p=>p.s===set&&!p.lang).flatMap(p=>p.qids),listen:LISTEN.filter(l=>l.s===set).map(l=>l.id)}}
function mock(){
  if(M.phase==='pick')return`<h2>모의고사 <span class="jp" style="font-size:.6em;color:var(--mute)">模擬試験</span></h2><p class="sub">실제 시험 순서 그대로: 1교시 언어지식·독해(제한시간) → 2교시 청해(음성 1회 재생)</p>
  ${[1,2].map(s=>{const m=mockIds(s);const h=S.hist.filter(x=>x.set===s).slice(-1)[0];return`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div><b style="font-size:18px">제${s}회 모의고사</b><br><span class="hint">언어지식 ${m.lang.length} · 독해 ${m.read.length} · 청해 ${m.listen.length}문항 · 1교시 50분</span>${h?`<br><span class="hint">최근 ${h.total}점 (${h.pass?'합격권':'불합격권'}) · ${h.date}</span>`:''}</div><button class="btn pri" data-mstart="${s}">시작</button></div></div>`}).join('')}
  <p class="hint">실제 1교시는 110분이에요. 이 모의고사는 문항 수에 맞춰 50분으로 줄였어요.</p>
  ${S.hist.length?`<h3>응시 기록</h3><table><thead><tr><th>날짜</th><th>회차</th><th style="text-align:right">언어</th><th style="text-align:right">독해</th><th style="text-align:right">청해</th><th style="text-align:right">총점</th></tr></thead><tbody>${S.hist.slice().reverse().map(h=>`<tr><td>${h.date}</td><td>${h.set}회</td><td style="text-align:right">${h.lang}</td><td style="text-align:right">${h.read}</td><td style="text-align:right">${h.listen}</td><td style="text-align:right"><b>${h.total}</b></td></tr>`).join('')}</tbody></table>`:''}`;
  const m=mockIds(M.set);
  if(M.phase==='p1')return`<div class="sticky"><div><b>제${M.set}회 · 1교시</b><br><span class="hint">언어지식(문자·어휘·문법)·독해</span></div><div class="timer" id="timer">--:--</div><button class="btn pri" data-msubmit>1교시 제출</button></div>
  ${m.lang.map(id=>card(Q[id],'mock',M.ans[id])).join('')}
  ${READ.filter(p=>p.s===M.set).map(p=>`<h3 class="jp">${p.k}：${p.title}</h3><div class="passage">${p.text.split('\n').map(x=>`<p>${x}</p>`).join('')}</div>${p.qids.map(id=>card(Q[id],'mock',M.ans[id])).join('')}`).join('')}
  <div class="row" style="margin-top:20px"><button class="btn pri" data-msubmit style="flex:1">1교시 제출하고 청해로</button></div>`;
  if(M.phase==='p2'){const id=m.listen[M.li];const q=Q[id];
    return`<div class="sticky"><div><b>제${M.set}회 · 2교시 청해</b><br><span class="hint">${M.li+1} / ${m.listen.length}</span></div><button class="btn" data-mquit>중단</button></div>
    ${card(q,'mock',M.ans[id])}<div class="row"><button class="btn pri" data-mnext style="flex:1">${M.li<m.listen.length-1?'다음 문항':'시험 종료 · 채점'}</button></div>`}
  if(M.phase==='res'){const r=M.res;
    return`<h2>제${M.set}회 결과</h2><div class="row" style="align-items:flex-end;gap:16px"><div class="big">${r.total}<span style="font-size:.35em;color:var(--mute)"> / 180</span></div><span class="passbadge ${r.pass?'':'no'}">${r.pass?'합격권':'불합격권'}</span></div></div>
    <div class="score">${[['언어지식',r.lang,r.c.lang],['독해',r.read,r.c.read],['청해',r.listen,r.c.listen]].map(([l,v,c])=>`<div class="${v<19?'fail':''}">${l}<b>${v}</b><span class="hint">${c} 정답${v<19?' · 과락':''}</span></div>`).join('')}</div>
    <p class="hint">합격 기준: 총점 100점 이상 + 각 과목 19점 이상. 점수는 정답률을 60점 만점으로 환산한 추정치예요.</p>
    <div class="row"><button class="btn pri" data-mback>모의고사 목록</button><a class="btn" href="#wrong" style="display:inline-flex;align-items:center;text-decoration:none">오답노트로</a></div>
    <h3>전체 해설</h3>${[...m.lang,...m.read,...m.listen].map(id=>(Q[id].ctx!=null&&Q[id].id.endsWith('-0')?`<h3 class="jp">${READ[Q[id].ctx].title}</h3><div class="trans">${READ[Q[id].ctx].tr}</div>`:'')+card(Q[id],'review',M.ans[id])).join('')}`}
}
let timerId=null;
function tick(){const el=$('#timer');const left=Math.max(0,M.end-Date.now());if(el){const mm=Math.floor(left/60000),ss=Math.floor(left/1000)%60;el.textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;el.classList.toggle('low',left<5*60000)}
  if(left<=0&&M.phase==='p1'){clearInterval(timerId);M.phase='p2';M.li=0;render();scrollTo(0,0)}}
function finishMock(){const m=mockIds(M.set);const sc=ids=>{const c=ids.filter(id=>M.ans[id]!=null&&Q[id].opts[M.ans[id]].ok).length;ids.forEach(id=>{if(M.ans[id]!=null&&Q[id].opts[M.ans[id]].ok)delete S.wrong[id];else S.wrong[id]=1;S.done[id]=1});return[Math.round(c/ids.length*60),c+'/'+ids.length]};
  const [lang,cl]=sc(m.lang),[read,cr]=sc(m.read),[listen,cli]=sc(m.listen);
  READ.filter(p=>p.s===M.set).forEach(p=>S.done[p.id]=1);LISTEN.filter(l=>l.s===M.set).forEach(l=>S.done[l.id]=1);
  const total=lang+read+listen,pass=total>=100&&lang>=19&&read>=19&&listen>=19;
  M.res={lang,read,listen,total,pass,c:{lang:cl,read:cr,listen:cli}};const d=new Date();
  S.hist.push({set:M.set,lang,read,listen,total,pass,date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});S.hist=S.hist.slice(-30);save();M.phase='res';render();scrollTo(0,0)}

// ---- answer handling
function answer(qid,i,wq){const q=Q[qid];const el=document.getElementById('c-'+qid);const mode=el?el.dataset.mode:'practice';
  if(mode==='mock'){M.ans[qid]=i;el.outerHTML=card(q,'mock',i);return}
  const key=wq?'w'+qid:qid;if(P[key]!=null)return;P[key]=i;
  if(!q.tmp){const ok=q.opts[i].ok;if(ok){if(wq||S.wrong[qid])delete S.wrong[qid]}else S.wrong[qid]=1;S.done[qid]=1;
    if(q.sec==='read'){const p=READ[q.ctx];if(p.qids.every(id=>P[id]!=null))S.done[p.id]=1}save()}
  let html=card(q,'practice',i);if(wq)html=html.replace(/data-q="/g,'data-wq="1" data-q="');
  if(el)el.outerHTML=html;if(route==='vocab'&&st.vSub==='quiz'||route==='grammar'&&st.gSub==='quiz'){const y=scrollY;render();scrollTo(0,y)}}

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-vnext],[data-reveal]');if(!t)return;const d=t.dataset;
  if(d.q!=null&&d.i!=null){answer(d.q,+d.i,!!d.wq);return}
  if(d.play!=null){const q=Q[d.play];if(M.phase==='p2'&&route==='mock'){if(M.played[q.id])return;M.played[q.id]=1;t.disabled=true;t.textContent='재생 중'}
    const box=document.getElementById('p-'+q.id);box&&box.classList.add('playing');play(lParts(q),()=>{box&&box.classList.remove('playing');if(route==='mock'&&M.played[q.id])t.textContent='재생 완료'});return}
  if(d.stop!=null){if(route==='mock'&&M.phase==='p2')return;stopAll();document.querySelectorAll('.player.playing').forEach(x=>x.classList.remove('playing'));return}
  if(d.say!=null){say(d.say);return}
  if(d.vsub){st.vSub=d.vsub;st.vFlip=false;render();return}
  if(d.gsub){st.gSub=d.gsub;render();return}
  if(d.vmark!=null){mark(d.id,d.vmark==='1');const n=vPool().length;if(st.vFilter==='all'||d.vmark==='0')st.vi=(st.vi+1)%Math.max(n,1);render();return}
  if(d.rmark!=null){mark(d.id,d.rmark==='1');st.rev=null;render();return}
  if(d.reveal!=null){const due=dueList();st.rev=due[0];render();return}
  if(d.vmore!=null){st.vShow+=200;$('#vrows').innerHTML=vRows();return}
  if(d.kmore!=null){st.kShow+=60;render();return}
  if(d.vnext!=null){if(swiped){swiped=false;return}const n=vPool().length;st.vi=(st.vi+1)%n;render();return}
  if(d.vnav){const n=vPool().length;st.vi=(st.vi+ +d.vnav+n)%n;st.vFlip=false;render();return}
  if(d.vshuf!=null){st.vOrder=shuf(st.vOrder||lvList().map(v=>v.id));st.vi=0;st.vFlip=false;render();return}
  if(d.newquiz){st[d.newquiz==='v'?'vQuiz':'gQuiz']=null;render();scrollTo(0,0);return}
  if(d.type){st.typeSel=d.type;render();return}
  if(d.gram){if(S.gram[d.gram])delete S.gram[d.gram];else S.gram[d.gram]=1;save();const open=t.closest('details');$('#grows').innerHTML=gRows();return}
  if(d.ropen){st.rOpen=+d.ropen<0?null:+d.ropen;st.showTr=false;render();scrollTo(0,0);return}
  if(d.tr!=null){st.showTr=!st.showTr;const y=scrollY;render();scrollTo(0,y);return}
  if(d.lopen){stopAll();st.lOpen=+d.lopen<0?null:+d.lopen;render();scrollTo(0,0);return}
  if(d.mstart){M={phase:'p1',set:+d.mstart,ans:{},played:{},li:0,end:Date.now()+50*60000};clearInterval(timerId);render();scrollTo(0,0);tick();timerId=setInterval(tick,1000);return}
  if(d.msubmit!=null){const m=mockIds(M.set);const un=[...m.lang,...m.read].filter(id=>M.ans[id]==null).length;
    if(un&&!t.dataset.sure){document.querySelectorAll('[data-msubmit]').forEach(b=>{b.dataset.sure=1;b.textContent=`미응답 ${un}문항 · 그래도 제출`});return}
    clearInterval(timerId);M.phase='p2';M.li=0;render();scrollTo(0,0);return}
  if(d.mnext!=null){stopAll();const m=mockIds(M.set);if(M.li<m.listen.length-1){M.li++;render();scrollTo(0,0)}else finishMock();return}
  if(d.mquit!=null){stopAll();clearInterval(timerId);M={phase:'pick'};render();return}
  if(d.mback!=null){M={phase:'pick'};render();scrollTo(0,0);return}
  if(d.reset!=null){$('#resetbox').innerHTML='<p class="warn">외운 단어, 진도, 오답, 모의고사 기록이 모두 지워져요.</p><button class="btn pri" data-reset2>정말 초기화</button>';return}
  if(d.reset2!=null){S.known={};S.gram={};S.done={};S.wrong={};S.hist=[];S.srs={};save();for(const k in P)delete P[k];render();return}
});
document.addEventListener('keydown',e=>{if(route==='vocab'&&st.vSub==='card'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){if(e.key==='ArrowRight'){st.vi++;st.vFlip=false;render()}else if(e.key==='ArrowLeft'){const n=vPool().length;st.vi=(st.vi-1+n)%n;st.vFlip=false;render()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();st.vi++;render()}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='exam'&&t.value){S.exam=t.value;save();render()}
  if(t.id==='rate'){S.rate=+t.value;save()}
  if(t.id==='vfilter'){st.vFilter=t.value;st.vi=0;render()}
  if(t.id==='vlv'){st.vLv=t.value;st.vOrder=null;st.vi=0;st.vShow=200;st.vQuiz=null;render()}
  if(t.id==='glv'){st.gLv=t.value;st.gQuiz=null;render()}
  if(t.id==='klv'){st.kLv=t.value;st.kShow=60;render()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='vsearch'){st.vq=t.value;st.vShow=200;$('#vrows').innerHTML=vRows()}
  if(t.id==='kq'){st.kq=t.value;st.kShow=60;const y=t.selectionStart;render();const el=$('#kq');if(el){el.focus();try{el.setSelectionRange(y,y)}catch(e){}}}
  if(t.id==='gsearch'){st.gq=t.value;$('#grows').innerHTML=gRows()}});
let sx=null,swiped=false;
document.addEventListener('touchstart',e=>{if(e.target.closest('.flash'))sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){swiped=true;setTimeout(()=>swiped=false,400);const n=vPool().length;st.vi=(st.vi+(dx<0?1:-1)+n)%n;render()}},{passive:true});
window.appBack=()=>{if(route==='reading'&&st.rOpen!=null){st.rOpen=null;render();return true}if(route==='listening'&&st.lOpen!=null){stopAll();st.lOpen=null;render();return true}if(route==='mock'&&M.phase!=='pick')return false;if(route!=='home'){location.hash='#home';return true}return false};
addEventListener('hashchange',setRoute);
setRoute();
setTimeout(()=>{loadV();const el=$('#vinfo');if(el)el.textContent=AT?(()=>{try{return '음성: '+AT.info()}catch(e){return ''}})():hasTTS?(VO.length?`일본어 음성 ${VO.length}개 사용 가능: ${VO.slice(0,3).map(v=>v.name).join(', ')}`:'일본어 음성을 찾지 못했어요. 기기 TTS 설정에서 일본어를 추가하세요.'):''},900);
}
</script>
